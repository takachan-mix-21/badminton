          </div>

            <span class="game-pt-lbl">GAME 2</span>
            <div class="point-btns">
              <button class="point-btn"        data-game="1" data-pt="11" onclick="selectGamePoint(this,1,11)">11点</button>
              <button class="point-btn"        data-game="1" data-pt="15" onclick="selectGamePoint(this,1,15)">15点</button>

    <div class="alert alert-info" id="entry-info" style="margin-bottom:12px">1チーム <span id="entry-mpt-display">4</span> 名で登録します（メンバー数は「大会設定」から変更できます）</div>

@keyframes spin{to{transform:rotate(360deg)}}
.save-btn-wrap{padding:0 14px 14px}

<script>
// ========== STATE ==========
var CATS = ['md','wd','xd'];
var CAT_NAMES = {md:'男子ダブルス',wd:'女子ダブルス',xd:'ミックスダブルス'};
var CAT_LABELS = {md:'MD',wd:'WD',xd:'XD'};
var TEAM_COLORS = [
  {bg:'rgba(124,77,255,0.2)',text:'#b39ddb'},
  {bg:'rgba(0,161,255,0.15)',text:'#4fc3f7'},
  {bg:'rgba(0,229,160,0.15)',text:'#00e5a0'},
  {bg:'rgba(255,209,102,0.15)',text:'#ffd166'},
  {bg:'rgba(255,79,107,0.15)',text:'#ff4f6b'},
  {bg:'rgba(255,160,50,0.15)',text:'#ffb74d'},
  {bg:'rgba(200,80,200,0.15)',text:'#ce93d8'},
  {bg:'rgba(100,200,80,0.15)',text:'#a5d6a7'},
  {bg:'rgba(255,120,120,0.15)',text:'#ef9a9a'},
  {bg:'rgba(100,160,255,0.15)',text:'#90caf9'},
  {bg:'rgba(80,220,200,0.15)',text:'#80cbc4'},
  {bg:'rgba(255,200,80,0.15)',text:'#ffe082'},
];

var cfg = {
  tournamentName: '',
  membersPerTeam: 4,
  gamePoints: [11, 21, 21],
  divisions: [
    {name:'1部', leagueCount:2, teamsPerLeague:4, advanceCount:2},
    {name:'2部', leagueCount:2, teamsPerLeague:4, advanceCount:2},
    {name:'3部', leagueCount:2, teamsPerLeague:4, advanceCount:2},
    {name:'4部', leagueCount:2, teamsPerLeague:4, advanceCount:2},
  ]
};

var data = [];
var currentModal = null;
var activeDivTab = {league:0, ranking:0, tourn:0};

// ========== SETTINGS PAGE ==========
var DIV_NAMES = ['1部','2部','3部','4部'];

function renderDivSettings() {
  var d = cfg.divisions[0];
  document.getElementById('div-settings').innerHTML =
    '<div class="form-row" style="margin-bottom:10px">' +
    '<div class="form-field"><label>リーグ数 <span style="color:var(--text3);font-weight:400">（全部共通）</span></label>' +
    '<input type="number" id="shared-league-count" min="1" max="10" value="' + d.leagueCount + '" inputmode="numeric" oninput="updateSharedSetting(\'leagueCount\',this.value)"></div>' +
    '<div class="form-field"><label>1リーグのチーム数 <span style="color:var(--text3);font-weight:400">（全部共通）</span></label>' +
    '<input type="number" id="shared-teams" min="2" max="12" value="' + d.teamsPerLeague + '" inputmode="numeric" oninput="updateSharedSetting(\'teamsPerLeague\',this.value)"></div></div>' +
    '<div class="form-field" style="margin-bottom:0"><label>トーナメント進出チーム数 <span style="color:var(--text3);font-weight:400">（各リーグから・全部共通）</span></label>' +
    '<input type="number" id="shared-advance" min="1" max="8" value="' + d.advanceCount + '" inputmode="numeric" oninput="updateSharedSetting(\'advanceCount\',this.value)"></div>';
}

function updateSharedSetting(key, val) {
  var n = parseInt(val) || 1;
  cfg.divisions.forEach(function(div) { div[key] = n; });
  previewSettings();
}

function previewSettings() {
  var gp = cfg.gamePoints;
  var totalTeams = 0, totalMatches = 0;
  cfg.divisions.forEach(function(div) {
    totalTeams += div.leagueCount * div.teamsPerLeague;
    totalMatches += div.leagueCount * (div.teamsPerLeague*(div.teamsPerLeague-1)/2);
  });
  document.getElementById('summary-bar').innerHTML =
    cfg.divisions.map(function(div) {
      return '<div class="chip"><span class="chip-val">' + div.name + '</span><span class="chip-lbl">' + div.leagueCount + 'リーグ×' + div.teamsPerLeague + 'チーム</span></div>';
    }).join('') +
    '<div class="chip"><span class="chip-val">' + totalTeams + '</span><span class="chip-lbl">総チーム数</span></div>' +
    '<div class="chip"><span class="chip-val">' + gp[0] + '-' + gp[1] + '-' + gp[2] + '</span><span class="chip-lbl">G1-G2-G3点</span></div>';
  document.getElementById('settings-info').textContent =
    '合計 ' + totalMatches + ' 試合（MD/WD/XD×3ゲーム） / G1=' + gp[0] + '点 G2=' + gp[1] + '点 G3=' + gp[2] + '点';
}

function selectGamePoint(btn, gameIdx, pt) {
  document.querySelectorAll('.point-btn[data-game="' + gameIdx + '"]').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  cfg.gamePoints[gameIdx] = pt;
  previewSettings();
}

function applySettings() {
  var name = document.getElementById('s-tournament-name').value.trim();
  cfg.tournamentName = name;
  var brandText = document.querySelector('.brand-text');
  brandText.innerHTML = name ? '<span style="color:var(--accent)">' + esc(name) + '</span>' : 'ADMIN <span>PANEL</span>';
  cfg.divisions.forEach(function(div, di) {
    div.leagueCount = Math.max(1,Math.min(10,div.leagueCount));
    div.teamsPerLeague = Math.max(2,Math.min(12,div.teamsPerLeague));
    div.advanceCount = Math.max(1,Math.min(div.teamsPerLeague,div.advanceCount));
    if (!data[di]) data[di]=[];
    while (data[di].length < div.leagueCount) {
      var li=data[di].length;
      data[di].push({teams:Array.from({length:div.teamsPerLeague},function(_,i){return div.name+ALPHA[li]+(i+1);}),results:{}});
    }
    data[di].length = div.leagueCount;
    data[di].forEach(function(lg) {
      while(lg.teams.length<div.teamsPerLeague) lg.teams.push('チーム'+(lg.teams.length+1));
      lg.teams.length=div.teamsPerLeague;
    });
  });
  data.length = cfg.divisions.length;
  buildAllUI();
  showPage('leagues');
  scheduleAutoSave();
}

// ========== LEAGUE UI ==========
var ALPHA = 'ABCDEFGHIJKLMNOPQRST';

function buildAllUI() {
  buildDivTabsUI('league','div-tabs-league','div-panels-league',buildLeagueDivPanel,'no-leagues','leagues-content');
  buildDivTabsUI('ranking','div-tabs-ranking','div-panels-ranking',buildRankingDivPanel,'no-ranking','ranking-content');
  buildTournamentUI();
}

function buildDivTabsUI(kind, tabsId, panelsId, panelBuilder, noId, contentId) {
  var tabsEl=document.getElementById(tabsId);
  var panelsEl=document.getElementById(panelsId);
  tabsEl.innerHTML=''; panelsEl.innerHTML='';
  var curDi = Math.min(activeDivTab[kind]||0, cfg.divisions.length-1);
  cfg.divisions.forEach(function(div,di) {
    var tab=document.createElement('button');
    tab.className='dtab'+(di===curDi?' active':'');
    tab.textContent=div.name;
    tab.onclick=function(){switchDivTab(kind,di);};
    tabsEl.appendChild(tab);
    var panel=document.createElement('div');
    panel.id=kind+'-div-panel-'+di;
    panel.className='div-tab-content div-tab-pane'+(di===curDi?' active':'');
    panel.innerHTML=panelBuilder(di);
    panelsEl.appendChild(panel);
  });
  document.getElementById(noId).style.display='none';
  document.getElementById(contentId).style.display='block';
}

function switchDivTab(kind, di) {
  Object.keys(activeDivTab).forEach(function(k) { activeDivTab[k]=di; });
  var tabsId=kind==='league'?'div-tabs-league':kind==='ranking'?'div-tabs-ranking':'div-tabs-tourn';
  document.querySelectorAll('#'+tabsId+' .dtab').forEach(function(t,i){t.classList.toggle('active',i===di);});
  var panelsId=kind==='league'?'div-panels-league':kind==='ranking'?'div-panels-ranking':'div-panels-tourn';
  document.querySelectorAll('#'+panelsId+' .div-tab-pane').forEach(function(p,i){p.classList.toggle('active',i===di);});
}

function buildLeagueDivPanel(di) {
  var div=cfg.divisions[di];
  var html='<div style="font-size:10px;color:var(--text3);padding:8px 0 2px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.08em">'+div.name+' — '+data[di].length+'リーグ×'+div.teamsPerLeague+'チーム</div>';
  html+='<div id="lpanels-'+di+'">';
  data[di].forEach(function(_,li) {
    html+='<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em;padding:14px 0 8px;border-top:1px solid var(--border);margin-top:8px">'+ALPHA[li]+'リーグ</div>';
    html+='<div id="lpanel-'+di+'-'+li+'">'+buildLeaguePanel(di,li)+'</div>';
  });
  html+='</div>';
  return html;
}

function buildRankingDivPanel(di) {
  var html='<div id="rpanels-'+di+'" style="padding-top:8px">';
  data[di].forEach(function(_,li) {
    html+='<div id="rpanel-'+di+'-'+li+'">'+buildRankingPanel(di,li)+'</div>';
  });
  html+='</div>';
  return html;
}

function switchLeagueTab(di,li) {
  document.querySelectorAll('#ltabs-'+di+' .ltab').forEach(function(t,i){t.classList.toggle('active',i===li);});
  document.querySelectorAll('#lpanels-'+di+' .league-sub-panel').forEach(function(p,i){p.classList.toggle('active',i===li);});
}
function switchRankingTab(di,li) {
  document.querySelectorAll('#rtabs-'+di+' .ltab').forEach(function(t,i){t.classList.toggle('active',i===li);});
  document.querySelectorAll('#rpanels-'+di+' .league-sub-panel').forEach(function(p,i){p.classList.toggle('active',i===li);});
}

function buildLeaguePanel(di,li) {
  var lg=data[di][li];
  var divName=(cfg.divisions[di]&&cfg.divisions[di].name)||((di+1)+'部');
  var availableEntries=entries.filter(function(e){return (e.status||'approved')!=='rejected' && e.teamName;});
  var nameHtml='<div class="team-name-grid">';
  lg.teams.forEach(function(name,ti) {
    var c=TEAM_COLORS[ti%TEAM_COLORS.length];
    var defaultName=divName+ALPHA[li]+(ti+1);
    var isDefault=(name===defaultName);
    var assignedEntry=availableEntries.find(function(e){return e.placedSlot && e.placedSlot.di===di && e.placedSlot.li===li && e.placedSlot.ti===ti;});
    var sel='<select class="team-name-inp team-name-sel" onchange="assignTeamToSlot('+di+','+li+','+ti+',this.value)">';
    sel+='<option value="'+esc(defaultName)+'"'+(isDefault?' selected':'')+'>(未選択)</option>';
    availableEntries.forEach(function(e) {
      var used=(e.placedSlot && (e.placedSlot.di!==di||e.placedSlot.li!==li||e.placedSlot.ti!==ti));
      var lbl=e.teamName+(e.status==='pending'?' [承認待ち]':'')+(used?' ('+(cfg.divisions[e.placedSlot.di]&&cfg.divisions[e.placedSlot.di].name||'')+ALPHA[e.placedSlot.li]+(e.placedSlot.ti+1)+'に配置済)':'');
      var isSel=(e===assignedEntry)||(!isDefault&&!assignedEntry&&e.teamName===name);
      sel+='<option value="'+esc(e.teamName)+'"'+(isSel?' selected':'')+'>'+esc(lbl)+'</option>';
    });
    if(!isDefault && !assignedEntry && !availableEntries.some(function(e){return e.teamName===name;})) {
      sel+='<option value="'+esc(name)+'" selected>'+esc(name)+' (旧データ)</option>';
    }
    sel+='</select>';
    nameHtml+='<div class="team-name-row"><div class="team-badge" style="background:'+c.bg+';color:'+c.text+'">'+ALPHA[li]+(ti+1)+'</div>'+sel+'</div>';
  });
  nameHtml+='</div>';
  var tbl='<div class="tbl-wrap"><table class="league-tbl"><thead><tr><th class="th-team"></th>';
  lg.teams.forEach(function(_,ti) {
    var c=TEAM_COLORS[ti%TEAM_COLORS.length];
    tbl+='<th><span style="background:'+c.bg+';color:'+c.text+';padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700">'+ALPHA[li]+(ti+1)+'</span></th>';
  });
  tbl+='<th>MD</th><th>WD</th><th>XD</th><th>総勝</th></tr></thead><tbody>';
  lg.teams.forEach(function(name,ri) {
    var c=TEAM_COLORS[ri%TEAM_COLORS.length];
    var mdW=0,wdW=0,xdW=0,totalW=0;
    tbl+='<tr><td class="team-cell"><span style="background:'+c.bg+';color:'+c.text+';padding:1px 6px;border-radius:4px;font-size:10px;margin-right:5px">'+ALPHA[li]+(ri+1)+'</span>'+esc(name)+'</td>';
    lg.teams.forEach(function(_,ci) {
      if(ri===ci){tbl+='<td class="diagonal"></td>';return;}
      var r=getMatchDirect(lg,ri,ci);
      if(!r){tbl+='<td class="empty-cell" onclick="openModal('+di+','+li+','+ri+','+ci+')" style="cursor:pointer;min-width:110px"><span style="color:var(--text3);font-size:18px">+</span></td>';return;}
      var cellW=0;CATS.forEach(function(cat){if(catWin(r[cat])==='A')cellW++;});
      var cellL=3-cellW;
      var tcol=cellW>cellL?'var(--accent)':cellW<cellL?'var(--red)':'var(--yellow)';
      if(catWin(r.md)==='A')mdW++;if(catWin(r.wd)==='A')wdW++;if(catWin(r.xd)==='A')xdW++;totalW+=cellW;
      tbl+='<td class="score-cell" onclick="openModal('+di+','+li+','+ri+','+ci+')" style="cursor:pointer"><div class="score-inner"><div class="total-row"><span class="total-lbl">TOT</span><span class="total-score" style="color:'+tcol+'">'+cellW+'</span><span style="font-size:10px;color:var(--text3)">-</span><span class="total-score" style="color:var(--text3)">'+cellL+'</span></div>';
      CATS.forEach(function(cat) {
        var games=r[cat];var wins=cWins(games);var iw=catWin(r[cat])==='A';
        tbl+='<div class="cat-row"><span class="cat-lbl '+cat+'">'+CAT_LABELS[cat]+'</span><span style="font-size:9px;font-weight:700;color:'+(iw?'var(--accent)':'var(--red)')+'">'+( iw?'○':'✕')+'</span><span class="game-scores">';
        games.forEach(function(g){tbl+='<span class="gs '+(g.a>g.b?'w':'l')+'">'+g.a+'-'+g.b+'</span>';});
        tbl+='</span><span class="cat-wl '+(wins.wA>wins.wB?'w':'l')+'">'+wins.wA+'-'+wins.wB+'</span></div>';
      });
      tbl+='</div></td>';
    });
    tbl+='<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:var(--blue)">'+mdW+'</td>';
    tbl+='<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:var(--pink)">'+wdW+'</td>';
    tbl+='<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:var(--purple)">'+xdW+'</td>';
    tbl+='<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:900;color:var(--accent)">'+totalW+'</td></tr>';
  });
  tbl+='</tbody></table></div>';
  return nameHtml+tbl;
}

function refreshLeaguePanel(di,li) {
  var el=document.getElementById('lpanel-'+di+'-'+li);
  if(el) el.innerHTML=buildLeaguePanel(di,li);
}
var _teamNameTimer = null;
function updateTeamName(di,li,ti,val) {
  data[di][li].teams[ti]=val;
  refreshLeaguePanel(di,li);
  refreshRankingPanel(di,li);
  clearTimeout(_teamNameTimer);
  _teamNameTimer = setTimeout(scheduleAutoSave, 1000);
}

function assignTeamToSlot(di,li,ti,val) {
  var divName=(cfg.divisions[di]&&cfg.divisions[di].name)||((di+1)+'部');
  var defaultName=divName+ALPHA[li]+(ti+1);
  var affected={};
  affected[di+'_'+li]=true;

  entries.forEach(function(e) {
    if (e.placedSlot && e.placedSlot.di===di && e.placedSlot.li===li && e.placedSlot.ti===ti && e.teamName!==val) {
      delete e.placedSlot;
      delete e.placedLabel;
    }
  });

  if (!val || val===defaultName) {
    data[di][li].teams[ti]=defaultName;
  } else {
    var match=null;
    for (var i=0;i<entries.length;i++) {
      if (entries[i].teamName===val) { match=entries[i]; break; }
    }
    if (match) {
      if (match.placedSlot && (match.placedSlot.di!==di||match.placedSlot.li!==li||match.placedSlot.ti!==ti)) {
        var ps=match.placedSlot;
        var prevDivName=(cfg.divisions[ps.di]&&cfg.divisions[ps.di].name)||((ps.di+1)+'部');
        if (data[ps.di]&&data[ps.di][ps.li]&&data[ps.di][ps.li].teams) {
          data[ps.di][ps.li].teams[ps.ti]=prevDivName+ALPHA[ps.li]+(ps.ti+1);
          affected[ps.di+'_'+ps.li]=true;
        }
      }
      match.placedSlot={di:di,li:li,ti:ti};
      match.placedLabel=divName+' '+ALPHA[li]+'リーグ '+(ti+1)+'番';
      if (match.status==='pending') match.status='approved';
    }

  }

  Object.keys(affected).forEach(function(k) {
    var p=k.split('_');
    refreshLeaguePanel(parseInt(p[0]),parseInt(p[1]));
    refreshRankingPanel(parseInt(p[0]),parseInt(p[1]));
  });
  scheduleAutoSave();
}

// ========== MATCH HELPERS ==========
function matchKey(a,b){return a<b?(a+'_'+b):(b+'_'+a);}
function getMatchDirect(lg,ri,ci) {
  var key=matchKey(ri,ci);
  if(!lg.results[key]) return null;
  var r=lg.results[key];
  if(ri<ci) return r;
  var flip=function(g){return {a:g.b,b:g.a};};
  return{md:r.md.map(flip),wd:r.wd.map(flip),xd:r.xd.map(flip)};
}
function cWins(games){var wA=0,wB=0;games.forEach(function(g){if(g.a>g.b)wA++;else if(g.b>g.a)wB++;});return{wA:wA,wB:wB};}
function catWin(games){var w=cWins(games);return w.wA>w.wB?'A':w.wB>w.wA?'B':null;}
function totalPts(match){var pf=0,pa=0;CATS.forEach(function(c){match[c].forEach(function(g){pf+=g.a;pa+=g.b;});});return{pf:pf,pa:pa};}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ========== TOURNAMENT ==========
var tournamentStates = [];
var currentTournMatch = null;
var tournWinnerOverride = null;
var entries = [];

function seedBracket(seeds) {
  var n=seeds.length;if(n===0)return[];
  var size=1;while(size<n)size*=2;
  var slots=new Array(size).fill(null);
  var order=buildSeedOrder(size);
  seeds.forEach(function(s,i){if(i<order.length)slots[order[i]]=s;});
  return slots;
}
function buildSeedOrder(size) {
  if(size===1)return[0];if(size===2)return[0,1];
  var half=size/2;var top=buildSeedOrder(half);var bottom=buildSeedOrder(half);var result=new Array(size);
  top.forEach(function(v,i){result[i]=v;});bottom.forEach(function(v,i){result[size-1-i]=v+half;});
  return result;
}

function getDivisionSeeds(di) {
  var div = cfg.divisions[di];
  var adv = div.advanceCount;
  var numLeagues = data[di].length;
  var leagueStandings = data[di].map(function(lg, li) {
    var standings = lg.teams.map(function(name, ti) {
      var totalW=0,pf=0,pa=0;
      lg.teams.forEach(function(_,oi) {
        if(oi===ti)return;var r=getMatchDirect(lg,ti,oi);if(!r)return;
        CATS.forEach(function(c){if(catWin(r[c])==='A')totalW++;});
        var pt=totalPts(r);pf+=pt.pf;pa+=pt.pa;
      });
      return{ti:ti,name:name,totalW:totalW,diff:pf-pa,pf:pf};
    });
    standings.sort(function(a,b){return b.totalW-a.totalW||b.diff-a.diff||b.pf-a.pf;});
    return standings;
  });
  var byRank = [];
  for (var rank = 0; rank < adv; rank++) {
    byRank[rank] = [];
    for (var li = 0; li < numLeagues; li++) {
      var s = leagueStandings[li][rank];
      if (!s) continue;
      byRank[rank][li] = {
        di:di, li:li, rank:rank, rankInLeague:rank,
        name:s.name, totalW:s.totalW, diff:s.diff, pf:s.pf,
        color:TEAM_COLORS[s.ti % TEAM_COLORS.length],
        leagueLabel:ALPHA[li]
      };
    }
  }
  var total = adv * numLeagues;
  var size = 1; while (size < total) size *= 2;
  var slots = new Array(size).fill(null);
  var half = size / 2;
  var topSlots = [], bottomSlots = [];
  for (var i = 0; i < half; i++) topSlots.push(i);
  for (var i = size-1; i >= half; i--) bottomSlots.push(i);
  var topIdx = 0, bottomIdx = 0;
  for (var rank = 0; rank < adv; rank++) {
    for (var li = 0; li < numLeagues; li++) {
      var team = byRank[rank] && byRank[rank][li];
      if (!team) continue;
      if (li % 2 === 0) {
        if (topIdx < topSlots.length) slots[topSlots[topIdx++]] = team;
      } else {
        if (bottomIdx < bottomSlots.length) slots[bottomSlots[bottomIdx++]] = team;
      }
    }
  }
  return slots.filter(function(s){return s !== null;});
}

function initTournamentStateForDiv(di) {
  var seeds = getDivisionSeeds(di);
  var size = 1; while (size < seeds.length) size *= 2;
  var slots = new Array(size).fill(null);
  seeds.forEach(function(s, i) { slots[i] = s; });
  tournamentStates[di] = { seeds: seeds.slice(), slots: slots, matchResults: {} };
}

function getTournamentRoundsForDiv(di) {
  var ts = tournamentStates[di];
  if (!ts) return [];
  var slots = ts.slots || seedBracket(ts.seeds);
  if (!slots.length) return [];
  var rounds = [slots.slice()]; var current = slots.slice(); var ri = 0;
  while (current.length > 1) {
    var next = [];
    for (var mi = 0; mi < current.length; mi += 2) {
      var a=current[mi],b=current[mi+1];
      if(a&&!b){next.push(a);continue;}if(!a&&b){next.push(b);continue;}
      var res = ts.matchResults[ri+'_'+(mi/2)];
      next.push(res ? res.winner : null);
    }
    rounds.push(next); current = next; ri++;
  }
  return rounds;
}

    [0,1,2].forEach(function(gi) {

    });
    body += '</div>';

  var curWinner = res?(res.winner===teamA?'A':'B'):'';
  body += '<div style="margin-top:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)">' +
    '<div style="font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:700">勝者（スコアから自動判定 / 手動上書き可）</div>' +
    '<div style="display:flex;gap:8px">' +
    '<button id="tw-btn-a" onclick="selectTournWinner(\'A\')" class="btn btn-sm" style="flex:1;'+(curWinner==='A'?'background:var(--accent-dim);color:var(--accent);border-color:rgba(0,229,160,0.4)':'')+'">'+esc(teamA.name)+'</button>' +
    '<button id="tw-btn-b" onclick="selectTournWinner(\'B\')" class="btn btn-sm" style="flex:1;'+(curWinner==='B'?'background:var(--accent-dim);color:var(--accent);border-color:rgba(0,229,160,0.4)':'')+'">'+esc(teamB.name)+'</button>' +
    '</div></div>';
  document.getElementById('modal-body').innerHTML = body;
  document.querySelector('.modal .btn-primary').setAttribute('onclick','saveTournMatch()');
  document.getElementById('modal-overlay').classList.add('open');
}

function selectTournWinner(side) {
  tournWinnerOverride = side;

function saveTournMatch() {
  if (!currentTournMatch) return;
  var di=currentTournMatch.di, ri=currentTournMatch.ri, mi=currentTournMatch.mi;
  var teamA=currentTournMatch.teamA, teamB=currentTournMatch.teamB;
  var key = ri+'_'+mi; var result = {md:[],wd:[],xd:[]};
  CATS.forEach(function(cat) {
    [0,1,2].forEach(function(gi) {
      var sa=parseInt(document.getElementById('tm_'+cat+'_'+gi+'_a') && document.getElementById('tm_'+cat+'_'+gi+'_a').value)||0;
      var sb=parseInt(document.getElementById('tm_'+cat+'_'+gi+'_b') && document.getElementById('tm_'+cat+'_'+gi+'_b').value)||0;
      result[cat].push({a:sa,b:sb});
    });
  });
  var winner = null;
  if (tournWinnerOverride) { winner = tournWinnerOverride==='A'?teamA:teamB; }
  else {
    var wA=CATS.filter(function(c){return catWin(result[c])==='A';}).length;
    var wB=CATS.filter(function(c){return catWin(result[c])==='B';}).length;
    if(wA>wB)winner=teamA;else if(wB>wA)winner=teamB;
  }
  result.winner = winner;
  result.winnerName = winner ? winner.name : null;
  tournamentStates[di].matchResults[key] = result;
  tournWinnerOverride = null;
  document.getElementById('modal-overlay').classList.remove('open');

  if (totalRounds <= 0) { panel.innerHTML = html; return; }

  var roundNames = ['1回戦','2回戦','準々決勝','準決勝','決勝'];
  html += '<div class="sec-title">ブラケット <span style="font-weight:400;color:var(--text3);font-size:10px;letter-spacing:0">試合枠をタップしてスコア入力</span></div><div class="bracket-rounds">';

  for (var ri = 0; ri < totalRounds; ri++) {
    var matchCount = rounds[ri].length / 2;
    var rName = roundNames[Math.max(0, roundNames.length-totalRounds+ri)] || '第'+(ri+1)+'回戦';
    html += '<div class="bracket-round"><div class="bracket-round-title">'+rName+'</div><div class="bracket-col">';
    for (var mi = 0; mi < matchCount; mi++) {
      var teamA=rounds[ri][mi*2], teamB=rounds[ri][mi*2+1];
      var isByeA=!teamA, isByeB=!teamB;
      var key=ri+'_'+mi;
      var res=ts.matchResults[key];
      var autoWinner=isByeB?teamA:isByeA?teamB:null;
      var winner=res?res.winner:autoWinner;
      var canTap=!!(teamA&&teamB);
      html+='<div class="bracket-spacer"></div><div class="bracket-match"'+(canTap?' onclick="openTournModal('+di+','+ri+','+mi+')" style="cursor:pointer"':'')+'>'; 
      if(canTap&&!res) html+='<div style="font-size:9px;color:var(--text3);text-align:center;padding:2px 0;font-family:\'Barlow Condensed\',sans-serif;letter-spacing:.04em">TAP TO ENTER</div>';
      if(res){
        var cr=CATS.map(function(c){var w=catWin(res[c]);return '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:9px;color:'+(w==='A'?'var(--accent)':'var(--red)')+'">'+CAT_LABELS[c]+(w==='A'?'○':'✕')+'</span>';}).join(' ');
        html+='<div style="text-align:center;padding:2px 4px;display:flex;gap:4px;justify-content:center">'+cr+'</div>';
      }
      var teamRow=function(team,isWin){
        if(!team)return '<div class="bracket-team bye"><span class="bracket-team-seed">—</span><span>BYE</span></div>';
        var si=ts.seeds.indexOf(team);
        return '<div class="bracket-team'+(isWin?' winner':'')+'"><span class="bracket-team-seed" style="color:'+team.color.text+'">'+(si+1)+'</span><span style="font-size:9px;background:'+team.color.bg+';color:'+team.color.text+';padding:1px 4px;border-radius:3px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;flex-shrink:0">'+team.leagueLabel+(team.rankInLeague+1)+'位</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">'+esc(team.name)+'</span>'+(isWin?'<span style="font-size:10px;color:var(--accent)">✓</span>':'')+'</div>';
      };
      html+=teamRow(teamA,winner===teamA);
      html+='<div class="bracket-divider"></div>';
      html+=teamRow(teamB,winner===teamB);
      html+='</div><div class="bracket-gap"></div>';
    }
    html+='<div class="bracket-spacer"></div></div></div>';
  }

  var champion=rounds[totalRounds]?rounds[totalRounds][0]:null;
  html+='<div class="bracket-round"><div class="bracket-round-title" style="color:var(--yellow)">🏆 優勝</div>' +
    '<div class="bracket-col" style="justify-content:center;align-items:center;padding:16px 8px">' +
    (champion
      ?'<div style="text-align:center"><div style="font-size:22px;margin-bottom:6px">🏆</div><div style="font-size:11px;font-weight:700;color:var(--yellow)">'+esc(champion.name)+'</div><div style="font-size:9px;color:var(--text3);margin-top:2px">'+champion.leagueLabel+'リーグ '+(champion.rankInLeague+1)+'位</div></div>'
      :'<div style="text-align:center;color:var(--text3);font-size:11px">決勝<br>勝者</div>') +
    '</div></div>';
  html+='</div>';
  panel.innerHTML=html;
}

// ========== ENTRY ==========
function ensureEntryMembers(e) {
  if (!e.members) e.members = [];
  while (e.members.length < cfg.membersPerTeam) e.members.push({name:'', age:'', gender:''});
  e.members.length = cfg.membersPerTeam;
  e.members.forEach(function(m){ if (!('gender' in m)) m.gender = ''; });
}

function updateMembersCount(val) {
  var n = Math.max(1, Math.min(20, parseInt(val) || 1));
  cfg.membersPerTeam = n;
  entries.forEach(ensureEntryMembers);
  var disp = document.getElementById('entry-mpt-display');
  if (disp) disp.textContent = n;
  renderEntries();
  scheduleAutoSave();
}

function addEntry() {
  var defaultDiv = (cfg.divisions[0] && cfg.divisions[0].name) || '';
  if (activeEntryDivTab && activeEntryDivTab !== '__all__' && activeEntryDivTab !== '__unspecified__') {
    defaultDiv = activeEntryDivTab;
  }
  var newEntry = {teamName:'', email:'', repName:'', address:'', phone:'', division: defaultDiv, members:[], status:'approved', submittedAt: new Date().toISOString()};
  ensureEntryMembers(newEntry);
  entries.push(newEntry);
  renderEntries();
  scheduleAutoSave();
}

function removeEntry(idx) {
  if (!confirm('このエントリーを削除しますか？')) return;
  entries.splice(idx, 1);
  renderEntries();
  scheduleAutoSave();
}

function updateEntryTeamName(idx, val) {
  var entry = entries[idx];
  var oldName = entry.teamName;
  entry.teamName = val;
  if (entry.placedSlot) {
    var s = entry.placedSlot;
    if (data[s.di] && data[s.di][s.li] && data[s.di][s.li].teams && data[s.di][s.li].teams[s.ti] === oldName) {
      data[s.di][s.li].teams[s.ti] = val;
      refreshLeaguePanel(s.di, s.li);
      refreshRankingPanel(s.di, s.li);
    }
  }
  scheduleAutoSave();
}

function updateEntryEmail(idx, val) {
  entries[idx].email = val;
  scheduleAutoSave();
}

function updateEntryRepName(idx, val) {
  entries[idx].repName = val;
  scheduleAutoSave();
}

function updateEntryAddress(idx, val) {
  entries[idx].address = val;
  scheduleAutoSave();
}

function updateEntryPhone(idx, val) {
  entries[idx].phone = val;
  scheduleAutoSave();
}

function updateEntryDivision(idx, val) {
  entries[idx].division = val;
  renderEntries();
  scheduleAutoSave();
}

function updateMemberName(eidx, midx, val) {
  entries[eidx].members[midx].name = val;
  scheduleAutoSave();
}

function updateMemberAge(eidx, midx, val) {
  entries[eidx].members[midx].age = val;
  scheduleAutoSave();
}

function updateMemberGender(eidx, midx, val) {
  entries[eidx].members[midx].gender = val;
  scheduleAutoSave();
}

function setEntryStatusFromAdmin(idx, newStatus) {
  var entry = entries[idx];
  if (!entry) return;
  if (!currentTournamentId || !entry.submittedAt) {
    entry.status = newStatus;
    renderEntries();
    scheduleAutoSave();
    return;
  }
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      if (!res || !res.ok) { alert((res && res.error) || 'エラーが発生しました'); return; }
      var prev = res.prevPlacedSlot;
      entries[idx] = res.entry;
      if (res.entry.placedSlot) {
        var s = res.entry.placedSlot;
        if (data[s.di] && data[s.di][s.li] && data[s.di][s.li].teams) {
          data[s.di][s.li].teams[s.ti] = res.entry.teamName;
          refreshLeaguePanel(s.di, s.li);
          refreshRankingPanel(s.di, s.li);
        }
      }
      if (prev && (!res.entry.placedSlot || prev.di !== res.entry.placedSlot.di || prev.li !== res.entry.placedSlot.li || prev.ti !== res.entry.placedSlot.ti)) {
        if (data[prev.di] && data[prev.di][prev.li] && data[prev.di][prev.li].teams) {
          var divName = (cfg.divisions[prev.di] && cfg.divisions[prev.di].name) || ((prev.di+1)+'部');
          data[prev.di][prev.li].teams[prev.ti] = divName + ALPHA[prev.li] + (prev.ti+1);
          refreshLeaguePanel(prev.di, prev.li);
          refreshRankingPanel(prev.di, prev.li);
        }
      }
      renderEntries();
      showToast(newStatus==='approved'?'承認しました':newStatus==='rejected'?'却下しました':'保留に戻しました');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('エラー: '+e.message); })
    .setEntryStatus(currentTournamentId, entry.submittedAt, newStatus);
}

function renderEntries() {
  var el = document.getElementById('entry-list');
  if (!el) return;
  var countEl = document.getElementById('entry-count');
  if (countEl) {
    var pendingCount = entries.filter(function(e){return (e.status||'pending')==='pending';}).length;
    countEl.textContent = entries.length + '件' + (pendingCount > 0 ? ' （承認待ち '+pendingCount+'件）' : '');
  }
  var disp = document.getElementById('entry-mpt-display');
  if (disp) disp.textContent = cfg.membersPerTeam;

  if (!activeEntryDivTab) activeEntryDivTab = '__all__';

  var divTabsHtml = '<div class="div-tab-bar" style="margin-bottom:12px">';
  var allCount = entries.length;
  var allPending = entries.filter(function(e){return (e.status||'pending')==='pending';}).length;
  divTabsHtml += '<button class="dtab'+(activeEntryDivTab==='__all__'?' active':'')+'" onclick="setEntryDivTab(\'__all__\')">全部 '+allCount+(allPending?' (待'+allPending+')':'')+'</button>';
  cfg.divisions.forEach(function(div) {
    var divEntries = entries.filter(function(e){return e.division === div.name;});
    var divPending = divEntries.filter(function(e){return (e.status||'pending')==='pending';}).length;
    divTabsHtml += '<button class="dtab'+(activeEntryDivTab===div.name?' active':'')+'" onclick="setEntryDivTab(\''+esc(div.name).replace(/'/g,"\\'")+'\')">'+esc(div.name)+' '+divEntries.length+(divPending?' (待'+divPending+')':'')+'</button>';
  });
  var unspecified = entries.filter(function(e){
    return !e.division || !cfg.divisions.some(function(d){return d.name === e.division;});
  });
  if (unspecified.length > 0) {
    divTabsHtml += '<button class="dtab'+(activeEntryDivTab==='__unspecified__'?' active':'')+'" onclick="setEntryDivTab(\'__unspecified__\')">未指定 '+unspecified.length+'</button>';
  }
  divTabsHtml += '</div>';

  if (entries.length === 0) {
    el.innerHTML = divTabsHtml + '<div class="alert alert-info">まだエントリーがありません。下のボタンから追加してください。</div>';
    return;
  }

  var visible = entries.map(function(e, idx) { return {e:e, idx:idx}; }).filter(function(x) {
    if (activeEntryDivTab === '__all__') return true;
    if (activeEntryDivTab === '__unspecified__') {
      return !x.e.division || !cfg.divisions.some(function(d){return d.name === x.e.division;});
    }
    return x.e.division === activeEntryDivTab;
  });

  if (visible.length === 0) {
    el.innerHTML = divTabsHtml + '<div class="alert alert-info">この部門にはエントリーがありません。</div>';
    return;
  }

  var listHtml = visible.map(function(x, vi) {
    var e = x.e; var idx = x.idx;
    ensureEntryMembers(e);
    var c = TEAM_COLORS[idx % TEAM_COLORS.length];
    var status = e.status || 'approved';
    var statusBg, statusColor, statusText;
    if (status==='approved') { statusBg='var(--accent-dim)'; statusColor='var(--accent)'; statusText='承認済み'; }
    else if (status==='rejected') { statusBg='var(--red-dim)'; statusColor='var(--red)'; statusText='却下'; }
    else { statusBg='var(--yellow-dim)'; statusColor='var(--yellow)'; statusText='承認待ち'; }
    var html = '<div class="entry-card">';
    html += '<div class="entry-head">';
    html += '<div class="team-badge" style="background:'+c.bg+';color:'+c.text+'">'+(vi+1)+'</div>';
    html += '<input class="entry-text-inp" type="text" placeholder="チーム名" value="'+esc(e.teamName||'')+'" oninput="updateEntryTeamName('+idx+',this.value)">';
    html += '<span style="display:inline-flex;align-items:center;padding:4px 10px;background:'+statusBg+';color:'+statusColor+';border:1px solid '+statusColor+';border-radius:14px;font-size:11px;font-weight:700;flex-shrink:0">'+statusText+'</span>';
    html += '<button class="entry-remove-btn" onclick="removeEntry('+idx+')">削除</button>';
    html += '</div>';
    if (cfg.divisions.length > 0) {
      html += '<div class="entry-member-row" style="margin-bottom:8px">';
      html += '<span class="entry-member-lbl">部</span>';
      html += '<select class="entry-text-inp" onchange="updateEntryDivision('+idx+',this.value)">';
      html += '<option value=""'+(!e.division?' selected':'')+'>(未指定)</option>';
      cfg.divisions.forEach(function(d) {
        html += '<option value="'+esc(d.name)+'"'+(e.division===d.name?' selected':'')+'>'+esc(d.name)+'</option>';
      });
      html += '</select>';
      html += '</div>';
    }
    html += '<div style="margin-bottom:8px">';
    e.members.forEach(function(m, mi) {
      html += '<div class="entry-member-row">';
      html += '<span class="entry-member-lbl">'+(mi+1)+'</span>';
      html += '<input class="entry-text-inp" type="text" placeholder="メンバー名" value="'+esc(m.name||'')+'" oninput="updateMemberName('+idx+','+mi+',this.value)">';
      html += '<select class="entry-gender-sel" onchange="updateMemberGender('+idx+','+mi+',this.value)"><option value=""'+(!m.gender?' selected':'')+'>性別</option><option value="男"'+(m.gender==='男'?' selected':'')+'>男</option><option value="女"'+(m.gender==='女'?' selected':'')+'>女</option></select>';
      html += '<input class="entry-age-inp" type="number" min="0" max="120" inputmode="numeric" placeholder="年齢" value="'+(m.age!==''&&m.age!=null?esc(m.age):'')+'" oninput="updateMemberAge('+idx+','+mi+',this.value)">';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="entry-member-row" style="margin-bottom:8px">';
    html += '<span class="entry-member-lbl">👤</span>';
    html += '<input class="entry-text-inp" type="text" placeholder="代表者氏名" value="'+esc(e.repName||'')+'" oninput="updateEntryRepName('+idx+',this.value)">';
    html += '</div>';
    html += '<div class="entry-member-row" style="margin-bottom:8px">';
    html += '<span class="entry-member-lbl">🏠</span>';
    html += '<input class="entry-text-inp" type="text" placeholder="住所" value="'+esc(e.address||'')+'" oninput="updateEntryAddress('+idx+',this.value)">';
    html += '</div>';
    html += '<div class="entry-member-row" style="margin-bottom:8px">';
    html += '<span class="entry-member-lbl">📞</span>';
    html += '<input class="entry-text-inp" type="tel" placeholder="電話番号" value="'+esc(e.phone||'')+'" oninput="updateEntryPhone('+idx+',this.value)">';
    html += '</div>';
    html += '<div class="entry-member-row" style="margin-bottom:8px">';
    html += '<span class="entry-member-lbl">📧</span>';
    html += '<input class="entry-text-inp" type="email" placeholder="メールアドレス" value="'+esc(e.email||'')+'" oninput="updateEntryEmail('+idx+',this.value)">';
    html += '</div>';
    if (e.placedLabel) {
      html += '<div style="margin-top:8px;padding:6px 10px;background:var(--accent-dim);color:var(--accent);border-radius:var(--radius);font-size:11px;font-weight:700">配置先: '+esc(e.placedLabel)+'</div>';
    }
    html += '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">';
    if (status !== 'approved') {
      html += '<button class="btn btn-sm" style="flex:1;min-width:80px;background:var(--accent-dim);color:var(--accent);border-color:rgba(0,229,160,0.4)" onclick="setEntryStatusFromAdmin('+idx+',\'approved\')">✓ 承認</button>';
    }
    if (status !== 'rejected') {
      html += '<button class="btn btn-sm" style="flex:1;min-width:80px;background:var(--red-dim);color:var(--red);border-color:rgba(255,79,107,0.4)" onclick="setEntryStatusFromAdmin('+idx+',\'rejected\')">✕ 却下</button>';
    }
    if (status !== 'pending') {
      html += '<button class="btn btn-sm btn-ghost" style="flex:1;min-width:80px" onclick="setEntryStatusFromAdmin('+idx+',\'pending\')">↺ 保留に戻す</button>';
    }
    html += '</div></div>';
    return html;
  }).join('');

  el.innerHTML = divTabsHtml + '<div class="entry-grid">' + listHtml + '</div>';
}

var activeEntryDivTab = '__all__';
function setEntryDivTab(tab) {
  activeEntryDivTab = tab;
  renderEntries();
}

function moveSeed(di,idx,dir) {
  var seeds=tournamentStates[di].seeds;var newIdx=idx+dir;
  if(newIdx<0||newIdx>=seeds.length)return;
  var tmp=seeds[idx];seeds[idx]=seeds[newIdx];seeds[newIdx]=tmp;
  tournamentStates[di].matchResults={};renderTournPanel(di);scheduleAutoSave();
}
function resetTournamentSeeds(di) {initTournamentStateForDiv(di);renderTournPanel(di);scheduleAutoSave();}

function showPage(p) {
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.bnav-item').forEach(function(x){x.classList.remove('active');});
  document.getElementById('page-'+p).classList.add('active');
  var btn = document.getElementById('bnav-'+p);
  if (btn) btn.classList.add('active');
  if(p==='tournament') {
    if(!document.querySelector('#div-tabs-tourn .dtab')) { buildTournamentUI(); }
    else { syncDivTabActive('tourn'); }
  }
  if(p==='entry') { renderEntries(); }
  syncDivTabActive('league');
  syncDivTabActive('ranking');
  window.scrollTo(0,0);
}

function syncDivTabActive(kind) {
  var di = activeDivTab[kind]||0;
  var tabsId = kind==='league'?'div-tabs-league':kind==='ranking'?'div-tabs-ranking':'div-tabs-tourn';
  var panelsId = kind==='league'?'div-panels-league':kind==='ranking'?'div-panels-ranking':'div-panels-tourn';
  document.querySelectorAll('#'+tabsId+' .dtab').forEach(function(t,i){t.classList.toggle('active',i===di);});
  document.querySelectorAll('#'+panelsId+' .div-tab-pane').forEach(function(p,i){p.classList.toggle('active',i===di);});
}

var _cachedDeployUrl = null;

function gasShowUrls(id) {
  var t = _tournamentListCache.find(function(x){return x.id === id;});
  var name = (t && t.name) || '名前なし';
  if (typeof google === 'undefined' || !google.script) { showToast('（ローカル：GAS未接続）'); return; }
  if (_cachedDeployUrl) { showUrlsModal(id, name, _cachedDeployUrl); return; }
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(url){
      showLoading(false);
      _cachedDeployUrl = url;
      showUrlsModal(id, name, url);
    })
    .withFailureHandler(function(e){ showLoading(false); alert('URL取得エラー: '+e.message); })
    .getDeployUrl();
}

function showUrlsModal(id, name, baseUrl) {
  var urls = [
    {label:'大会メニュー', icon:'🏠', url: baseUrl + '?mode=menu&id=' + encodeURIComponent(id)},
    {label:'エントリー登録', icon:'📝', url: baseUrl + '?mode=entry&id=' + encodeURIComponent(id)},
    {label:'状況確認', icon:'🔍', url: baseUrl + '?mode=status&id=' + encodeURIComponent(id)},
    {label:'リーグ表', icon:'📊', url: baseUrl + '?mode=view&id=' + encodeURIComponent(id) + '&v=league'},
    {label:'順位表', icon:'🏅', url: baseUrl + '?mode=view&id=' + encodeURIComponent(id) + '&v=ranking'},
    {label:'トーナメント表', icon:'🏆', url: baseUrl + '?mode=view&id=' + encodeURIComponent(id) + '&v=tournament'},
    {label:'エントリー結果', icon:'👥', url: baseUrl + '?mode=view&id=' + encodeURIComponent(id) + '&v=entries'}
  ];
  document.getElementById('modal-title').innerHTML = '🔗 ' + esc(name) + ' の公開URL';
  var html = '<div style="font-size:11px;color:var(--text2);margin-bottom:12px;line-height:1.5">参加者やスマホに共有するURLです。タップでコピー or 別タブで開けます。</div>';
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  urls.forEach(function(u, i) {
    html += '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px">';
    html += '<div style="font-size:13px;font-weight:700;margin-bottom:6px">'+u.icon+' '+esc(u.label)+'</div>';
    html += '<input type="text" readonly value="'+esc(u.url)+'" id="url-input-'+i+'" style="width:100%;font-size:11px;padding:7px 9px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;outline:none;margin-bottom:6px;-webkit-appearance:none" onclick="this.select()">';
    html += '<div style="display:flex;gap:6px">';
    html += '<button class="btn btn-sm" style="flex:1;background:var(--accent-dim);color:var(--accent);border-color:rgba(0,229,160,0.4)" onclick="copyUrlToClipboard('+i+')">📋 コピー</button>';
    html += '<a class="btn btn-sm btn-ghost" style="flex:1;text-decoration:none" target="_blank" rel="noopener" href="'+esc(u.url)+'">↗ 開く</a>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('modal-body').innerHTML = html;
  var primaryBtn = document.querySelector('.modal .btn-primary');
  if (primaryBtn) {
    primaryBtn.style.display = 'none';
    primaryBtn.setAttribute('data-was-hidden', '1');
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function copyUrlToClipboard(idx) {
  var inp = document.getElementById('url-input-'+idx);
  if (!inp) return;
  inp.select();
  inp.setSelectionRange(0, 99999);
  var copied = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(inp.value).then(function(){ showToast('コピーしました'); }, function(){
      try { document.execCommand('copy'); showToast('コピーしました'); copied = true; }
      catch(e) { showToast('コピーに失敗しました'); }
    });
  } else {
    try { document.execCommand('copy'); showToast('コピーしました'); }
    catch(e) { showToast('コピーに失敗しました'); }
  }
}

function gasExportTournament(id) {
  var t = _tournamentListCache.find(function(x){return x.id === id;});
  var name = (t && t.name) || '名前なし';
  if (!confirm('大会「' + name + '」をスプレッドシートに整形して書き出しますか？\n（既存の同名シートは上書きされます）')) return;
  showLoading(true);
  if (typeof google === 'undefined' || !google.script) { showLoading(false); showToast('（ローカル：GAS未接続）'); return; }
  google.script.run
    .withSuccessHandler(function(res){
      showLoading(false);
      if (res && res.ok) {
        showToast('シート「'+res.sheetName+'」に出力しました');
        if (res.url && confirm('出力したシートを開きますか？')) {
          window.open(res.url, '_blank');
        }
      } else {
        alert((res && res.error) || '出力に失敗しました');
      }
    })
    .withFailureHandler(function(e){ showLoading(false); alert('出力エラー: ' + e.message); })
    .exportTournamentToSheet(id);
}

function gasDeleteTournament(id) {
  var t = _tournamentListCache.find(function(x){return x.id === id;});
  var name = (t && t.name) || '名前なし';
  if (!confirm('大会「' + name + '」を削除しますか？\nこの操作は元に戻せません。')) return;
  showLoading(true);
  if (typeof google === 'undefined' || !google.script) { showLoading(false); showToast('（ローカル：GAS未接続）'); return; }
  google.script.run
    .withSuccessHandler(function(res){
      showLoading(false);
      if (res && res.ok) { showToast('削除しました'); gasLoadList(); }
      else alert((res && res.error) || '削除に失敗しました');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('削除エラー: ' + e.message); })
    .deleteTournament(id);
}

function loadFromGAS(saved) {
  _lastLoadTime = new Date().toISOString();
  if (!saved) { buildAllUI(); showPage('settings'); return; }
  if (saved.cfg) {
    if (saved.cfg.tournamentName) {
      cfg.tournamentName = saved.cfg.tournamentName;
      document.getElementById('s-tournament-name').value = saved.cfg.tournamentName;
      document.querySelector('.brand-text').innerHTML = '<span style="color:var(--accent)">' + esc(saved.cfg.tournamentName) + '</span>';
    }
    if (saved.cfg.gamePoints) {
      cfg.gamePoints = saved.cfg.gamePoints;
      [0,1,2].forEach(function(gi) {
        document.querySelectorAll('.point-btn[data-game="'+gi+'"]').forEach(function(b) {
          b.classList.toggle('active', parseInt(b.dataset.pt)===cfg.gamePoints[gi]);
        });
      });
    }
    if (saved.cfg.divisions) { cfg.divisions = saved.cfg.divisions; renderDivSettings(); previewSettings(); }
    if (saved.cfg.membersPerTeam) {
      cfg.membersPerTeam = saved.cfg.membersPerTeam;
      var mptInp = document.getElementById('s-members-per-team');
      if (mptInp) mptInp.value = cfg.membersPerTeam;
    }
  }
  entries = saved.entries || [];
  entries.forEach(ensureEntryMembers);
  data = saved.data;
  cfg.divisions.forEach(function(div,di){ if(data[di]) div.leagueCount=data[di].length; });
  tournamentStates = [];
  if (saved.tournamentStates) {
    saved.tournamentStates.forEach(function(ts, di) {
      if (!ts) return;
      var size = 1; var n = ts.seeds ? ts.seeds.length : 0;
      while (size < n) size *= 2;
      var slots = new Array(size).fill(null);
      if (ts.seeds) ts.seeds.forEach(function(s, i) { slots[i] = s; });
      var matchResults = {};
      Object.entries(ts.matchResults || {}).forEach(function(entry) {
        var key = entry[0]; var res = entry[1];
        var winner = res.winnerName
          ? (ts.seeds || []).find(function(s) { return s && s.name === res.winnerName; }) || null
          : null;
        matchResults[key] = Object.assign({}, res, {winner: winner});
      });
      tournamentStates[di] = { seeds: ts.seeds || [], slots: slots, matchResults: matchResults };
    });
  }
  buildAllUI();
  showPage('leagues');
}

var _isSaving = false;
var _lastLoadTime = null;
var _pendingSave = false;
var _autoSaveTimer = null;

function scheduleAutoSave() {
  if (!currentTournamentId && !cfg.tournamentName) return;
  clearTimeout(_autoSaveTimer);
  showSaveStatus('pending');
  _autoSaveTimer = setTimeout(function(){ _doSave(false); }, 2000);
}

function gasSave() { clearTimeout(_autoSaveTimer); _doSave(true); }

function _doSave(isManual) {
  if (typeof google === 'undefined' || !google.script) { if (isManual) showToast('（ローカル：GAS未接続）'); return; }
  if (_isSaving) { _pendingSave = true; return; }
  _isSaving = true; _pendingSave = false;
  showSaveStatus('saving');
  var name    = cfg.tournamentName || '名前なし';
  var summary = cfg.divisions.map(function(d){ return d.name+':'+d.leagueCount+'リーグ'; }).join(' / ');
  var ts = tournamentStates.map(function(t) { return t ? { seeds: t.seeds, matchResults: t.matchResults } : null; });
  var payload = { cfg:cfg, data:data, tournamentStates:ts, entries:entries, name:name, summary:summary, lastLoadTime:_lastLoadTime };
  google.script.run
    .withSuccessHandler(function(newId) {
      _isSaving = false;
      if (newId) currentTournamentId = newId;
      showSaveStatus('saved');
      if (_pendingSave) { _pendingSave = false; _doSave(false); }
      if (isManual) showToast('保存しました');
    })
    .withFailureHandler(function(e) {
      _isSaving = false; showSaveStatus('error');
      if (isManual) alert('保存エラー: '+e.message);
    })
    .saveTournament(currentTournamentId, JSON.stringify(payload));
}

function showSaveStatus(status) {
  var el = document.getElementById('save-status');
  if (!el) return;
  if (status==='pending') { el.textContent='…'; el.style.color='var(--text3)'; }
  else if (status==='saving') { el.textContent='保存中…'; el.style.color='var(--text3)'; }
  else if (status==='saved') { el.textContent='✓ 保存済み'; el.style.color='var(--accent)'; setTimeout(function(){ if(el.textContent==='✓ 保存済み') el.textContent=''; }, 3000); }
  else if (status==='error') { el.textContent='⚠ 保存失敗'; el.style.color='var(--red)'; }
}

function gasLoadList() {
  showLoading(true);
  if (typeof google !== 'undefined' && google.script) {
    google.script.run
      .withSuccessHandler(function(list){ showLoading(false); renderTournamentList(list); })
      .withFailureHandler(function(e){ showLoading(false); document.getElementById('tournament-list').innerHTML='<div class="alert alert-warn">読み込みエラー: '+e.message+'</div>'; })
      .loadTournamentList();
  } else { showLoading(false); renderTournamentList([]); }
}

function gasLoadTournament(id) {
  showLoading(true);
  if (typeof google !== 'undefined' && google.script) {
    google.script.run
      .withSuccessHandler(function(d){ showLoading(false); currentTournamentId=id; openTournament(id, d); })
      .withFailureHandler(function(e){ showLoading(false); alert('読み込みエラー: '+e.message); })
      .loadTournament(id);
  } else { showLoading(false); openTournament(id, null); }
}

function showLoading(on) { document.getElementById('loading-overlay').style.display = on ? 'flex' : 'none'; }
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity='0'; }, 2500);
}

renderDivSettings();
previewSettings();

function startApp(pageType, tournamentId) {
  if (typeof google !== 'undefined' && google.script) { gasLoadList(); }
  else if (typeof google !== 'undefined' && google.script) { gasLoadList(); }
  else { document.getElementById('page-home').classList.add('active'); renderTournamentList([]); }
}

try {
  startApp(typeof gasPage !== 'undefined' ? gasPage : null,
           typeof gasId   !== 'undefined' ? gasId   : null);
} catch(e) {
  console.error('startApp error:', e);
  document.getElementById('page-home').classList.add('active');
  renderTournamentList([]);
}
</script>
