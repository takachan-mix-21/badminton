<style>
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1f2435;
  --surface:#252b3b;--surface2:#2e3549;
  --accent:#00e5a0;--accent2:#00b87a;

}

html,body{min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;padding-bottom:calc(20px + var(--safe-bottom))}

.btn{padding:10px 18px;border:1px solid var(--border2);background:transparent;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;transition:.2s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.rank-tbl{width:100%;border-collapse:collapse;font-size:12px}

.view-section-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:14px 0 10px;display:flex;align-items:center;gap:8px}

.view-mode-tabs{display:flex;gap:6px;margin-bottom:12px}
.view-mode-tab{flex:1;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);background:var(--bg);font-family:'Zen Kaku Gothic New',sans-serif;min-height:36px}

@keyframes spin{to{transform:rotate(360deg)}}
#loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0f1117;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;z-index:400;pointer-events:none;max-width:90vw;text-align:center}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
</style>

<div id="loading-overlay">

<script>
var initialAction = (gasAction === 'status') ? 'status' : (gasAction === 'view' ? 'view' : 'entry');
var directMode = !!gasId;
var directTourId = gasId || null;
var currentTour = null;
var lastSubmitted = null;
var viewData = null;
var viewActiveDiv = 0;
var viewActiveLeague = {};
var viewMode = 'league';
var ALPHA = 'ABCDEFGHIJKLMNOPQRST';
var CATS = ['md','wd','xd'];
var CAT_LABELS = {md:'MD',wd:'WD',xd:'XD'};
var TEAM_COLORS = [
  {bg:'rgba(124,77,255,0.2)',text:'#b39ddb'},
  {bg:'rgba(0,161,255,0.15)',text:'#4fc3f7'},
  {bg:'rgba(0,229,160,0.15)',text:'#00e5a0'},
  {bg:'rgba(255,209,102,0.15)',text:'#ffd166'},
  {bg:'rgba(255,79,107,0.15)',text:'#ff4f6b'},
  {bg:'rgba(255,160,50,0.15)',text:'#ffb74d'},
  {bg:'rgba(200,80,200,0.15)',text:'#ce93d8'},
  {bg:'rgba(100,200,80,0.15)',text:'#a5d6a7'},
  {bg:'rgba(255,120,120,0.15)',text:'#ef9a9a'},
  {bg:'rgba(100,160,255,0.15)',text:'#90caf9'},
  {bg:'rgba(80,220,200,0.15)',text:'#80cbc4'},
  {bg:'rgba(255,200,80,0.15)',text:'#ffe082'}
];

function esc(s){return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showLoading(on){document.getElementById('loading-overlay').style.display = on ? 'flex' : 'none';}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2500);}

function showPage(p) {
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
  document.getElementById('page-'+p).classList.add('active');
  var hideBackInDirect = directMode && (p === 'entry' || p === 'status-form' || p === 'view');
  var showBack = (p !== 'home') && !hideBackInDirect;
  document.getElementById('back-btn').style.display = showBack ? 'block' : 'none';
  window.scrollTo(0,0);
}

function goHome() {
  if (directMode) {
    if (initialAction === 'status') openStatusFor(directTourId);
    else if (initialAction === 'view') openViewFor(directTourId);
    else openEntryFor(directTourId);
    return;
  }
  currentTour = null;
  showPage('home');
  loadTourList();
}

function onThanksBack() {
  goHome();
}

function loadTourList() {
  showLoading(true);
  if (typeof google === 'undefined' || !google.script) {
    showLoading(false);
    document.getElementById('tour-list').innerHTML = '<div class="alert alert-warn">この画面はGoogle Apps Script上でのみ動作します。</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function(list){ showLoading(false); renderTourList(list); })
    .withFailureHandler(function(e){ showLoading(false); document.getElementById('tour-list').innerHTML = '<div class="alert alert-warn">読み込みエラー: '+esc(e.message)+'</div>'; })
    .loadTournamentList();
}

function renderTourList(list) {
  var el = document.getElementById('tour-list');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="alert alert-info">現在エントリー受付中の大会はありません。</div>';
    return;
  }
  el.innerHTML = list.map(function(t) {
    return '<div class="tour-card" style="display:block;cursor:default">' +
      '<div style="margin-bottom:10px"><div class="tour-card-name">'+esc(t.name || '名前なし')+'</div>' +
      '<div class="tour-card-sum">'+esc(t.summary || '')+'</div></div>' +

}

function onSubmit() {
  if (!currentTour) return;
  var teamName = document.getElementById('e-team-name').value.trim();
  if (!teamName) { showToast('チーム名を入力してください'); return; }
  var repName = document.getElementById('e-rep-name').value.trim();
  if (!repName) { showToast('代表者氏名を入力してください'); return; }
  var address = document.getElementById('e-address').value.trim();
  if (!address) { showToast('住所を入力してください'); return; }
  var phone = document.getElementById('e-phone').value.trim();
  if (!phone) { showToast('電話番号を入力してください'); return; }
  if (!/^[\d\-+()\s]+$/.test(phone)) { showToast('電話番号の形式が正しくありません'); return; }
  var email = document.getElementById('e-email').value.trim();
  if (!email) { showToast('メールアドレスを入力してください'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('メールアドレスの形式が正しくありません'); return; }
  var divs = (currentTour && currentTour.divisions) || [];
  if (divs.length > 0 && !selectedDivision) { showToast('希望部門を選択してください'); return; }
  var members = [];
  var n = currentTour.membersPerTeam;
  var filledCount = 0;
  for (var i = 0; i < n; i++) {
    var name = document.getElementById('m-name-'+i).value.trim();
    var ageStr = document.getElementById('m-age-'+i).value.trim();
    var age = ageStr === '' ? '' : parseInt(ageStr);
    members.push({name:name, age:age});
    if (name) filledCount++;
  }
  if (filledCount === 0) { showToast('メンバーを最低1名入力してください'); return; }

  var payload = {teamName: teamName, email: email, repName: repName, address: address, phone: phone, division: selectedDivision, members: members};
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      if (!res || !res.ok) { alert((res && res.error) || '送信に失敗しました'); return; }
      lastSubmitted = {tournament: currentTour.name, team: teamName, email: email, repName: repName, address: address, phone: phone, division: selectedDivision, members: members};
      renderThanks();
      var btn = document.getElementById('thanks-back-btn');
      if (btn) {
        if (directMode) { btn.style.display = 'none'; }
        else { btn.style.display = ''; btn.textContent = '大会一覧へ戻る'; }
      }
      showPage('thanks');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('送信エラー: '+e.message); })
    .submitEntry(currentTour.id, JSON.stringify(payload));
}

function renderStatusResult(res, email) {
  var el = document.getElementById('status-result-body');
  var html = '';
  if (res.status === 'not_found') {
    html = '<div class="alert alert-warn" style="margin-top:14px">「'+esc(email)+'」のエントリーは見つかりませんでした。<br>メールアドレスをご確認ください。</div>';
    el.innerHTML = html;
    return;
  }
  var label, color, bgColor, icon;
  if (res.status === 'approved') {
    label = '承認済み'; color = 'var(--accent)'; bgColor = 'var(--accent-dim)'; icon = '✓';
  } else if (res.status === 'rejected') {
    label = '却下'; color = 'var(--red)'; bgColor = 'var(--red-dim)'; icon = '✕';
  } else {
    label = '承認待ち'; color = 'var(--yellow)'; bgColor = 'var(--yellow-dim)'; icon = '⏳';
  }
  html += '<div class="card" style="text-align:center;padding:24px 16px;margin-bottom:14px">' +
    '<div style="font-size:36px;line-height:1;margin-bottom:8px">'+icon+'</div>' +
    '<div style="display:inline-block;padding:6px 16px;background:'+bgColor+';color:'+color+';border:1px solid '+color+';border-radius:20px;font-weight:700;font-size:14px">'+label+'</div>' +
    '</div>';
  html += '<div class="card" style="text-align:left;font-size:13px;line-height:1.6">';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TOURNAMENT</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.tournamentName)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TEAM</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.teamName || '-')+'</div>';
  if (res.division) {
    html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">DIVISION</div>';
    html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.division)+'</div>';
  }
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">EMAIL</div>';
  html += '<div style="margin-bottom:10px">'+esc(email)+'</div>';
  if (res.placedLabel) {
    html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">PLACED AT</div>';

  el.innerHTML = html;

}

function vMatchKey(a,b){return a<b?(a+'_'+b):(b+'_'+a);}
function vGetMatch(lg, ri, ci) {
  if (!lg.results) return null;
  var key = vMatchKey(ri, ci);
  if (!lg.results[key]) return null;
  var r = lg.results[key];
  if (ri < ci) return r;
  var flip = function(g) { return {a:g.b, b:g.a}; };
  return {md:r.md.map(flip), wd:r.wd.map(flip), xd:r.xd.map(flip)};
}
function vCWins(games){var wA=0,wB=0;games.forEach(function(g){if(g.a>g.b)wA++;else if(g.b>g.a)wB++;});return{wA:wA,wB:wB};}
function vCatWin(games){var w=vCWins(games);return w.wA>w.wB?'A':w.wB>w.wA?'B':null;}
function vTotalPts(match){var pf=0,pa=0;CATS.forEach(function(c){match[c].forEach(function(g){pf+=g.a;pa+=g.b;});});return{pf:pf,pa:pa};}

function buildViewLeaguePanel(di, li) {
  var lg = viewData.data[di][li];
  var teams = lg.teams || [];
  var nameHtml = '<div style="margin-bottom:14px">';
  teams.forEach(function(name, ti) {
    var c = TEAM_COLORS[ti % TEAM_COLORS.length];
    nameHtml += '<div class="team-list-row"><div class="team-list-badge" style="background:'+c.bg+';color:'+c.text+'">'+ALPHA[li]+(ti+1)+'</div><div class="team-list-name">'+esc(name)+'</div></div>';
  });
  nameHtml += '</div>';
  var tbl = '<div class="tbl-wrap"><table class="league-tbl"><thead><tr><th class="th-team"></th>';
  teams.forEach(function(_, ti) {
    var c = TEAM_COLORS[ti % TEAM_COLORS.length];
    tbl += '<th><span style="background:'+c.bg+';color:'+c.text+';padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700">'+ALPHA[li]+(ti+1)+'</span></th>';
  });
  tbl += '<th>MD</th><th>WD</th><th>XD</th><th>総勝</th></tr></thead><tbody>';
  teams.forEach(function(name, ri) {
    var c = TEAM_COLORS[ri % TEAM_COLORS.length];
    var mdW=0, wdW=0, xdW=0, totalW=0;
    tbl += '<tr><td class="team-cell"><span style="background:'+c.bg+';color:'+c.text+';padding:1px 6px;border-radius:4px;font-size:10px;margin-right:5px">'+ALPHA[li]+(ri+1)+'</span>'+esc(name)+'</td>';
    teams.forEach(function(_, ci) {
      if (ri===ci) { tbl += '<td class="diagonal"></td>'; return; }
      var r = vGetMatch(lg, ri, ci);
      if (!r) { tbl += '<td class="empty-cell" style="min-width:110px"><span style="color:var(--text3);font-size:11px">—</span></td>'; return; }
      var cellW=0; CATS.forEach(function(cat){if(vCatWin(r[cat])==='A')cellW++;});
      var cellL=3-cellW;
      var tcol = cellW>cellL?'var(--accent)':cellW<cellL?'var(--red)':'var(--yellow)';
      if (vCatWin(r.md)==='A') mdW++; if (vCatWin(r.wd)==='A') wdW++; if (vCatWin(r.xd)==='A') xdW++; totalW+=cellW;
      tbl += '<td class="score-cell"><div class="score-inner"><div class="total-row"><span class="total-lbl">TOT</span><span class="total-score" style="color:'+tcol+'">'+cellW+'</span><span style="font-size:10px;color:var(--text3)">-</span><span class="total-score" style="color:var(--text3)">'+cellL+'</span></div>';
      CATS.forEach(function(cat) {
        var games = r[cat]; var wins = vCWins(games); var iw = vCatWin(r[cat])==='A';
        tbl += '<div class="cat-row"><span class="cat-lbl '+cat+'">'+CAT_LABELS[cat]+'</span><span style="font-size:9px;font-weight:700;color:'+(iw?'var(--accent)':'var(--red)')+'">'+(iw?'○':'✕')+'</span><span class="game-scores">';
        games.forEach(function(g){ tbl += '<span class="gs '+(g.a>g.b?'w':'l')+'">'+g.a+'-'+g.b+'</span>'; });
        tbl += '</span><span class="cat-wl '+(wins.wA>wins.wB?'w':'l')+'">'+wins.wA+'-'+wins.wB+'</span></div>';
      });
      tbl += '</div></td>';
    });
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:var(--blue)">'+mdW+'</td>';
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:#f48fb1">'+wdW+'</td>';
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:#b39ddb">'+xdW+'</td>';
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:900;color:var(--accent)">'+totalW+'</td></tr>';
  });
  tbl += '</tbody></table></div>';
  return nameHtml + tbl;
}

function buildViewRankingPanel(di, li) {
  var lg = viewData.data[di][li];
  var teams = lg.teams || [];
  var div = viewData.divisions[di] || {};
  var adv = div.advanceCount || 0;
  var standings = teams.map(function(name, ti) {
    var totalW=0, mdW=0, wdW=0, xdW=0, pf=0, pa=0;
    teams.forEach(function(_, oi) {
      if (oi===ti) return;
      var r = vGetMatch(lg, ti, oi); if (!r) return;
      CATS.forEach(function(c){ if (vCatWin(r[c])==='A') totalW++; });
      if (vCatWin(r.md)==='A') mdW++; if (vCatWin(r.wd)==='A') wdW++; if (vCatWin(r.xd)==='A') xdW++;
      var pt = vTotalPts(r); pf += pt.pf; pa += pt.pa;
    });
    return {ti:ti, name:name, totalW:totalW, mdW:mdW, wdW:wdW, xdW:xdW, pf:pf, pa:pa, diff:pf-pa};
  });
  standings.sort(function(a,b){return b.totalW-a.totalW||b.diff-a.diff||b.pf-a.pf;});
  var html = '<div style="font-size:10px;color:var(--text3);padding:8px 0 6px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.08em">'+esc(div.name||'')+' '+ALPHA[li]+'リーグ 順位表</div>';
  html += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px"><table class="rank-tbl"><thead><tr><th>順位</th><th style="text-align:left">チーム</th><th>総勝</th><th>MD</th><th>WD</th><th>XD</th><th>得点</th><th>失点</th><th>差</th></tr></thead><tbody>';
  standings.forEach(function(s, i) {
    var rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
    var advcls = i<adv?'advance-row':'';
    var diff = (s.diff>=0?'+':'') + s.diff;
    var c = TEAM_COLORS[s.ti % TEAM_COLORS.length];
    html += '<tr class="'+advcls+'"><td><span class="rank-num '+rc+'">'+(i+1)+'</span></td>' +
      '<td style="text-align:left;padding:8px"><div style="display:flex;align-items:center;gap:6px">' +
      '<span style="background:'+c.bg+';color:'+c.text+';padding:1px 7px;border-radius:4px;font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700">'+ALPHA[li]+(s.ti+1)+'</span>' +
      '<span style="font-weight:700;font-size:12px">'+esc(s.name)+'</span>' +
      (i<adv?'<span style="font-size:9px;background:var(--accent-dim);color:var(--accent);padding:1px 5px;border-radius:3px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700">進出</span>':'') +
      '</div></td>' +
      '<td><span style="font-family:\'Barlow Condensed\',sans-serif;font-size:16px;font-weight:700;color:var(--accent)">'+s.totalW+'</span></td>' +
      '<td style="color:var(--blue);font-family:\'Barlow Condensed\',sans-serif;font-weight:700">'+s.mdW+'</td>' +
      '<td style="color:#f48fb1;font-family:\'Barlow Condensed\',sans-serif;font-weight:700">'+s.wdW+'</td>' +
      '<td style="color:#b39ddb;font-family:\'Barlow Condensed\',sans-serif;font-weight:700">'+s.xdW+'</td>' +
      '<td style="color:var(--accent)">'+s.pf+'</td><td style="color:var(--red)">'+s.pa+'</td>' +
      '<td style="font-weight:700;color:'+(s.diff>=0?'var(--accent)':'var(--red)')+'">'+diff+'</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderThanks() {
  if (!lastSubmitted) return;
  var html = '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TOURNAMENT</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(lastSubmitted.tournament)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TEAM</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(lastSubmitted.team)+'</div>';
  if (lastSubmitted.division) {
    html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">DIVISION</div>';
    html += '<div style="font-weight:700;margin-bottom:10px;color:var(--accent)">'+esc(lastSubmitted.division)+'</div>';
  }
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">REPRESENTATIVE</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.repName||'')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">ADDRESS</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.address||'')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">PHONE</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.phone||'')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">EMAIL</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.email)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">MEMBERS</div>';
  html += '<div>' + lastSubmitted.members.filter(function(m){return m.name;}).map(function(m, i) {
    return '<div style="padding:4px 0">'+(i+1)+'. '+esc(m.name)+(m.age!==''&&m.age!=null?' <span style="color:var(--text3)">('+esc(m.age)+'歳)</span>':'')+'</div>';
  }).join('') + '</div>';
  html += '<div style="margin-top:14px;padding:10px 14px;background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,209,102,0.3);border-radius:var(--radius);font-size:12px">⏳ 主催者の承認をお待ちください。承認後にこのメールアドレスで状況確認ができます。</div>';
  document.getElementById('thanks-summary').innerHTML = html;
}

if (directMode) {
  if (initialAction === 'status') openStatusFor(directTourId);
  else if (initialAction === 'view') openViewFor(directTourId);
  else openEntryFor(directTourId);
} else {
  loadTourList();
}
</script>
</body>
</html>
