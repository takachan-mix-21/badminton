<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バドミントン大会エントリー</title>
<script>
  var gasPage   = '<?= gasPage ?>';
  var gasId     = '<?= gasId ?>';
  var gasAction = '<?= gasAction ?>';
</script>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1f2435;
  --surface:#252b3b;--surface2:#2e3549;
  --accent:#00e5a0;--accent2:#00b87a;
  --accent-dim:rgba(0,229,160,0.12);--accent-dim2:rgba(0,229,160,0.06);
  --red:#ff4f6b;--red-dim:rgba(255,79,107,0.12);
  --yellow:#ffd166;--yellow-dim:rgba(255,209,102,0.12);
  --blue:#4fc3f7;--blue-dim:rgba(79,195,247,0.12);
  --text:#e8eaf2;--text2:#8b92a8;--text3:#555d75;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --radius:10px;--radius-lg:14px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;padding-bottom:calc(20px + var(--safe-bottom))}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px;display:flex;align-items:center;position:sticky;top:0;z-index:100;height:52px;gap:10px}
.brand-text{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.04em;flex:1}
.brand-text span{color:var(--accent)}
.user-badge{background:var(--blue-dim);color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.06em;border:1px solid rgba(79,195,247,0.3)}
.back-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 8px 4px 0;font-size:18px;line-height:1}
.content{padding:14px;max-width:560px;margin:0 auto}
.page{display:none}.page.active{display:block}
.sec-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:700;letter-spacing:.02em}
input[type=text],input[type=email],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:16px;background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;outline:none;transition:.2s;min-height:44px;-webkit-appearance:none;appearance:none;margin:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.btn{padding:10px 18px;border:1px solid var(--border2);background:transparent;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;transition:.2s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent);color:#0f1117;border-color:var(--accent)}
.btn-block{width:100%}
.btn-ghost{border-color:var(--border2);color:var(--text2)}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:12px;border:1px solid;line-height:1.5}
.alert-info{background:rgba(79,195,247,0.07);color:#4fc3f7;border-color:rgba(79,195,247,0.2)}
.alert-warn{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(255,209,102,0.3)}
.alert-success{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,229,160,0.3)}
.tour-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s}
.tour-card:active{background:var(--bg3)}
.tour-card-name{font-weight:700;font-size:15px;line-height:1.3}
.tour-card-sum{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4}
.member-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.member-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text3);width:34px;flex-shrink:0;text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 0}
.member-name-inp{flex:1!important;width:auto!important;min-height:40px!important;padding:9px 12px!important;font-size:14px!important}
.member-age-inp{width:78px!important;flex-shrink:0;text-align:center;padding:9px 8px!important;font-size:14px!important;min-height:40px!important}
.tour-info-block{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.tour-info-lbl{font-size:10px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.tour-info-name{font-size:17px;font-weight:700;line-height:1.3}
.tour-info-sub{font-size:11px;color:var(--text2);margin-top:6px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading-overlay .spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0f1117;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;z-index:400;pointer-events:none;max-width:90vw;text-align:center}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <button id="back-btn" class="back-btn" onclick="goHome()" style="display:none">←</button>
  <span class="brand-text">BADMINTON <span>ENTRY</span></span>
  <span class="user-badge">USER</span>
</div>

<div class="content">

  <div class="page active" id="page-home">
    <div class="sec-title">大会一覧</div>
    <div id="tour-list"><div class="alert alert-info">読み込み中...</div></div>
  </div>

  <div class="page" id="page-entry">
    <div class="sec-title">エントリーフォーム</div>
    <div class="card">
      <div class="tour-info-block">
        <div class="tour-info-lbl">TOURNAMENT</div>
        <div class="tour-info-name" id="tour-name"></div>
        <div class="tour-info-sub" id="tour-sub"></div>
      </div>
      <div style="margin-bottom:14px">
        <label>チーム名 <span style="color:var(--red)">*</span></label>
        <input type="text" id="e-team-name" placeholder="チーム名を入力" maxlength="60">
      </div>
      <div style="margin-bottom:14px">
        <label>代表者メールアドレス <span style="color:var(--red)">*</span> <span style="color:var(--text3);font-weight:400">（重複不可）</span></label>
        <input type="email" id="e-email" placeholder="example@example.com" maxlength="120" autocomplete="email">
      </div>
      <div>
        <label>メンバー <span id="e-member-count" style="color:var(--text3);font-weight:400"></span></label>
        <div id="e-members"></div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="onSubmit()" style="margin-bottom:8px">エントリーを送信</button>
    <button class="btn btn-ghost btn-block" onclick="goHome()">キャンセル</button>
  </div>

  <div class="page" id="page-status-form">
    <div class="sec-title">エントリー状況確認</div>
    <div class="card">
      <div class="tour-info-block">
        <div class="tour-info-lbl">TOURNAMENT</div>
        <div class="tour-info-name" id="status-tour-name"></div>
      </div>
      <div style="margin-bottom:14px">
        <label>登録済みのメールアドレス <span style="color:var(--red)">*</span></label>
        <input type="email" id="s-email" placeholder="example@example.com" maxlength="120" autocomplete="email">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="onCheckStatus()" style="margin-bottom:8px">確認する</button>
    <button class="btn btn-ghost btn-block" onclick="goHome()">キャンセル</button>
  </div>

  <div class="page" id="page-status-result">
    <div class="sec-title">確認結果</div>
    <div id="status-result-body"></div>
    <button class="btn btn-ghost btn-block" onclick="goHome()" style="margin-top:8px">戻る</button>
  </div>

  <div class="page" id="page-thanks">
    <div style="margin-top:24px;text-align:center">
      <div style="font-size:48px;line-height:1;margin-bottom:16px">🎉</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px;color:var(--accent)">送信完了</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:24px">エントリーを受け付けました。<br>ご応募ありがとうございました。</div>
      <div id="thanks-summary" class="card" style="text-align:left;font-size:13px;line-height:1.6"></div>
      <button id="thanks-back-btn" class="btn btn-block btn-primary" onclick="onThanksBack()" style="margin-top:8px">大会一覧へ戻る</button>
    </div>
  </div>

</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text2)">読み込み中...</div>
</div>
<div id="toast"></div>

<script>
var initialAction = (gasAction === 'status') ? 'status' : 'entry';
var directMode = !!gasId;
var directTourId = gasId || null;
var currentTour = null;
var lastSubmitted = null;

function esc(s){return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showLoading(on){document.getElementById('loading-overlay').style.display = on ? 'flex' : 'none';}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2500);}

function showPage(p) {
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
  document.getElementById('page-'+p).classList.add('active');
  var hideBackInDirect = directMode && (p === 'entry' || p === 'status-form');
  var showBack = (p !== 'home') && !hideBackInDirect;
  document.getElementById('back-btn').style.display = showBack ? 'block' : 'none';
  window.scrollTo(0,0);
}

function goHome() {
  if (directMode) {
    if (initialAction === 'status') openStatusFor(directTourId);
    else openEntryFor(directTourId);
    return;
  }
  currentTour = null;
  showPage('home');
  loadTourList();
}

function onThanksBack() {
  goHome();
}

function loadTourList() {
  showLoading(true);
  if (typeof google === 'undefined' || !google.script) {
    showLoading(false);
    document.getElementById('tour-list').innerHTML = '<div class="alert alert-warn">この画面はGoogle Apps Script上でのみ動作します。</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function(list){ showLoading(false); renderTourList(list); })
    .withFailureHandler(function(e){ showLoading(false); document.getElementById('tour-list').innerHTML = '<div class="alert alert-warn">読み込みエラー: '+esc(e.message)+'</div>'; })
    .loadTournamentList();
}

function renderTourList(list) {
  var el = document.getElementById('tour-list');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="alert alert-info">現在エントリー受付中の大会はありません。</div>';
    return;
  }
  el.innerHTML = list.map(function(t) {
    return '<div class="tour-card" style="display:block;cursor:default">' +
      '<div style="margin-bottom:10px"><div class="tour-card-name">'+esc(t.name || '名前なし')+'</div>' +
      '<div class="tour-card-sum">'+esc(t.summary || '')+'</div></div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn btn-primary" style="flex:1" onclick="openEntryFor(\''+esc(t.id)+'\')">エントリー</button>' +
      '<button class="btn btn-ghost" style="flex:1" onclick="openStatusFor(\''+esc(t.id)+'\')">状況確認</button>' +
      '</div></div>';
  }).join('');
}

function openEntryFor(id) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(info) {
      showLoading(false);
      if (!info) { alert('大会情報を取得できませんでした'); return; }
      currentTour = info;
      document.getElementById('tour-name').textContent = info.name;
      document.getElementById('tour-sub').textContent = '1チーム ' + info.membersPerTeam + ' 名で登録 ／ 現在 ' + info.entryCount + ' チーム エントリー済み';
      document.getElementById('e-team-name').value = '';
      var emailInp = document.getElementById('e-email');
      if (emailInp) emailInp.value = '';
      renderMembers();
      showPage('entry');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('読み込みエラー: '+e.message); })
    .getPublicTournamentInfo(id);
}

function openStatusFor(id) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(info) {
      showLoading(false);
      if (!info) { alert('大会情報を取得できませんでした'); return; }
      currentTour = info;
      document.getElementById('status-tour-name').textContent = info.name;
      document.getElementById('s-email').value = '';
      showPage('status-form');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('読み込みエラー: '+e.message); })
    .getPublicTournamentInfo(id);
}

function renderMembers() {
  var n = currentTour.membersPerTeam;
  document.getElementById('e-member-count').textContent = '（'+n+'名分）';
  var html = '';
  for (var i = 0; i < n; i++) {
    html += '<div class="member-row">' +
      '<span class="member-lbl">'+(i+1)+'</span>' +
      '<input class="member-name-inp" type="text" id="m-name-'+i+'" placeholder="名前" maxlength="40">' +
      '<input class="member-age-inp" type="number" id="m-age-'+i+'" min="0" max="120" inputmode="numeric" placeholder="年齢">' +
      '</div>';
  }
  document.getElementById('e-members').innerHTML = html;
}

function onSubmit() {
  if (!currentTour) return;
  var teamName = document.getElementById('e-team-name').value.trim();
  if (!teamName) { showToast('チーム名を入力してください'); return; }
  var email = document.getElementById('e-email').value.trim();
  if (!email) { showToast('メールアドレスを入力してください'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('メールアドレスの形式が正しくありません'); return; }
  var members = [];
  var n = currentTour.membersPerTeam;
  var filledCount = 0;
  for (var i = 0; i < n; i++) {
    var name = document.getElementById('m-name-'+i).value.trim();
    var ageStr = document.getElementById('m-age-'+i).value.trim();
    var age = ageStr === '' ? '' : parseInt(ageStr);
    members.push({name:name, age:age});
    if (name) filledCount++;
  }
  if (filledCount === 0) { showToast('メンバーを最低1名入力してください'); return; }

  var payload = {teamName: teamName, email: email, members: members};
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      if (!res || !res.ok) { alert((res && res.error) || '送信に失敗しました'); return; }
      lastSubmitted = {tournament: currentTour.name, team: teamName, email: email, members: members};
      renderThanks();
      var btn = document.getElementById('thanks-back-btn');
      if (btn) btn.textContent = directMode ? '別のチームをエントリー' : '大会一覧へ戻る';
      showPage('thanks');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('送信エラー: '+e.message); })
    .submitEntry(currentTour.id, JSON.stringify(payload));
}

function onCheckStatus() {
  if (!currentTour) return;
  var email = document.getElementById('s-email').value.trim();
  if (!email) { showToast('メールアドレスを入力してください'); return; }
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      if (!res || !res.ok) { alert((res && res.error) || '確認に失敗しました'); return; }
      renderStatusResult(res, email);
      showPage('status-result');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('エラー: '+e.message); })
    .checkEntryStatus(currentTour.id, email);
}

function renderStatusResult(res, email) {
  var el = document.getElementById('status-result-body');
  var html = '';
  if (res.status === 'not_found') {
    html = '<div class="alert alert-warn" style="margin-top:14px">「'+esc(email)+'」のエントリーは見つかりませんでした。<br>メールアドレスをご確認ください。</div>';
    el.innerHTML = html;
    return;
  }
  var label, color, bgColor, icon;
  if (res.status === 'approved') {
    label = '承認済み'; color = 'var(--accent)'; bgColor = 'var(--accent-dim)'; icon = '✓';
  } else if (res.status === 'rejected') {
    label = '却下'; color = 'var(--red)'; bgColor = 'var(--red-dim)'; icon = '✕';
  } else {
    label = '承認待ち'; color = 'var(--yellow)'; bgColor = 'var(--yellow-dim)'; icon = '⏳';
  }
  html += '<div class="card" style="text-align:center;padding:24px 16px;margin-bottom:14px">' +
    '<div style="font-size:36px;line-height:1;margin-bottom:8px">'+icon+'</div>' +
    '<div style="display:inline-block;padding:6px 16px;background:'+bgColor+';color:'+color+';border:1px solid '+color+';border-radius:20px;font-weight:700;font-size:14px">'+label+'</div>' +
    '</div>';
  html += '<div class="card" style="text-align:left;font-size:13px;line-height:1.6">';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TOURNAMENT</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.tournamentName)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TEAM</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.teamName || '-')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">EMAIL</div>';
  html += '<div style="margin-bottom:10px">'+esc(email)+'</div>';
  if (res.placedLabel) {
    html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">PLACED AT</div>';
    html += '<div style="font-weight:700;color:var(--accent)">'+esc(res.placedLabel)+'</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderThanks() {
  if (!lastSubmitted) return;
  var html = '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TOURNAMENT</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(lastSubmitted.tournament)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TEAM</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(lastSubmitted.team)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">EMAIL</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.email)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">MEMBERS</div>';
  html += '<div>' + lastSubmitted.members.filter(function(m){return m.name;}).map(function(m, i) {
    return '<div style="padding:4px 0">'+(i+1)+'. '+esc(m.name)+(m.age!==''&&m.age!=null?' <span style="color:var(--text3)">('+esc(m.age)+'歳)</span>':'')+'</div>';
  }).join('') + '</div>';
  html += '<div style="margin-top:14px;padding:10px 14px;background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,209,102,0.3);border-radius:var(--radius);font-size:12px">⏳ 主催者の承認をお待ちください。承認後にこのメールアドレスで状況確認ができます。</div>';
  document.getElementById('thanks-summary').innerHTML = html;
}

if (directMode) {
  if (initialAction === 'status') openStatusFor(directTourId);
  else openEntryFor(directTourId);
} else {
  loadTourList();
}
</script>
</body>
</html>
