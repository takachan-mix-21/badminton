.seed-league{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;flex-shrink:0}
.seed-name{font-size:14px;font-weight:800;flex:1;color:var(--text)}
.seed-stat{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text3);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,232,217,0.85);backdrop-filter:blur(6px);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loading-overlay .spinner{width:48px;height:48px;border:4px solid rgba(255,94,138,0.2);border-top-color:#ff5e8a;border-right-color:#ff9148;border-radius:50%;animation:spin .9s linear infinite}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff5e8a,#ff9148);color:#fff;padding:12px 28px;border-radius:30px;font-size:14px;font-weight:800;opacity:0;transition:opacity .3s,transform .3s;z-index:400;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(255,94,138,0.4)}
.top-btn{display:block;width:100%;margin-top:32px;padding:16px 18px;background:#fff;color:var(--accent);border:3px solid var(--accent);border-radius:30px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;letter-spacing:.04em;box-shadow:0 4px 0 var(--accent2);transition:transform .12s ease,box-shadow .12s ease;text-align:center;text-decoration:none;box-sizing:border-box}
.top-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--accent2);text-decoration:none}
.top-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <button id="back-btn" class="back-btn" onclick="goHome()" style="display:none">←</button>
  <span style="font-size:28px;line-height:1;animation:wiggle 3s ease-in-out infinite;display:inline-block">🏸</span>
  <span class="brand-text">BADMINTON <span>POP</span></span>
  <span class="user-badge">USER</span>
</div>

<div class="content">

  <div class="page active" id="page-home">
    <div class="sec-title">大会一覧</div>
    <div id="tour-list"><div class="alert alert-info">読み込み中...</div></div>
  </div>

  <div class="page" id="page-entry">
    <div class="sec-title">エントリーフォーム</div>
    <div class="card">
      <div class="tour-info-block">
        <div class="tour-info-lbl">TOURNAMENT</div>
        <div class="tour-info-name" id="tour-name"></div>
        <div class="tour-info-sub" id="tour-sub"></div>
      </div>
      <div style="margin-bottom:14px">
        <label>チーム名 <span style="color:var(--red)">*</span></label>
        <input type="text" id="e-team-name" placeholder="チーム名を入力" maxlength="60">
      </div>
      <div style="margin-bottom:14px" id="e-division-wrap">
        <label>希望部門 <span style="color:var(--red)">*</span></label>
        <div id="e-divisions" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div style="margin-bottom:14px">
        <label>メンバー <span id="e-member-count" style="color:var(--text3);font-weight:400"></span></label>
        <div id="e-members"></div>
      </div>
      <div style="margin-bottom:14px">
        <label>代表者氏名 <span style="color:var(--red)">*</span></label>
        <input type="text" id="e-rep-name" placeholder="山田 太郎" maxlength="60" autocomplete="name">
      </div>
      <div style="margin-bottom:14px">
        <label>住所 <span style="color:var(--red)">*</span></label>
        <input type="text" id="e-address" placeholder="〒000-0000 ○○県○○市○○町..." maxlength="200" autocomplete="street-address">
      </div>
      <div style="margin-bottom:14px">
        <label>電話番号 <span style="color:var(--red)">*</span></label>
        <input type="tel" id="e-phone" placeholder="090-1234-5678" maxlength="20" autocomplete="tel">
      </div>
      <div>
        <label>代表者メールアドレス <span style="color:var(--red)">*</span> <span style="color:var(--text3);font-weight:400">（重複不可）</span></label>
        <input type="email" id="e-email" placeholder="example@example.com" maxlength="120" autocomplete="email">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="onSubmit()" style="margin-bottom:8px">エントリーを送信</button>
    <button class="btn btn-ghost btn-block" onclick="goHome()">キャンセル</button>
  </div>

  <div class="page" id="page-status-form">
    <div class="sec-title">エントリー状況確認</div>
    <div class="card">
      <div class="tour-info-block">
        <div class="tour-info-lbl">TOURNAMENT</div>
        <div class="tour-info-name" id="status-tour-name"></div>
      </div>
      <div style="margin-bottom:14px">
        <label>登録済みのメールアドレス <span style="color:var(--red)">*</span></label>
        <input type="email" id="s-email" placeholder="example@example.com" maxlength="120" autocomplete="email">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="onCheckStatus()" style="margin-bottom:8px">確認する</button>
    <button class="btn btn-ghost btn-block" onclick="goHome()">キャンセル</button>
  </div>

  <div class="page" id="page-status-result">
    <div class="sec-title">確認結果</div>
    <div id="status-result-body"></div>
    <button class="btn btn-ghost btn-block" onclick="goHome()" style="margin-top:8px">戻る</button>
  </div>

  <div class="page" id="page-tour-menu">
    <h1 class="menu-tour-name" id="menu-tour-name">大会名</h1>
    <button class="menu-pill" onclick="goToMode('entries')">エントリー結果</button>
    <button class="menu-pill" onclick="goToMode('info')">大会要項</button>
    <button class="menu-pill" onclick="goToMode('league')">リーグ表</button>
    <button class="menu-pill" onclick="goToMode('tournament')">トーナメント表</button>
    <div class="menu-current-box">
      <div class="menu-current-title">現在試合中の試合番号</div>
      <div class="menu-current-grid" id="menu-current-matches"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn btn-ghost btn-block" onclick="goToMode('entry')">エントリー登録</button>
      <button class="btn btn-ghost btn-block" onclick="goToMode('status')">状況確認</button>
    </div>
  </div>

  <div class="page" id="page-tour-info">
    <div class="sec-title">大会要項</div>
    <div class="card" id="tour-info-body"></div>
  </div>

  <div class="page" id="page-view">
    <div class="sec-title" id="view-tour-title">リーグ表</div>
    <div class="alert alert-info" style="margin-bottom:12px;font-size:11px">📖 このページは閲覧専用です</div>
    <div class="view-mode-tabs">
      <button class="view-mode-tab active" id="vt-league" onclick="switchViewMode('league')">リーグ表</button>
      <button class="view-mode-tab" id="vt-ranking" onclick="switchViewMode('ranking')">順位表</button>
      <button class="view-mode-tab" id="vt-tournament" onclick="switchViewMode('tournament')">トーナメント</button>
      <button class="view-mode-tab" id="vt-entries" onclick="switchViewMode('entries')">エントリー結果</button>
    </div>
    <div class="div-tab-bar" id="view-div-tabs"></div>
    <div id="view-div-panels"></div>
  </div>

  <div class="page" id="page-thanks">
    <div style="margin-top:24px;text-align:center">
      <div style="font-size:48px;line-height:1;margin-bottom:16px">🎉</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:8px;color:var(--accent)">送信完了</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:24px">エントリーを受け付けました。<br>ご応募ありがとうございました。</div>
      <div id="thanks-summary" class="card" style="text-align:left;font-size:13px;line-height:1.6"></div>
      <button id="thanks-back-btn" class="btn btn-block btn-primary" onclick="onThanksBack()" style="margin-top:8px">大会一覧へ戻る</button>
    </div>
  </div>

  <a id="top-btn" class="top-btn" href="?mode=public" target="_top" style="display:none">トップへ戻る</a>

</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text2)">読み込み中...</div>
</div>
<div id="toast"></div>

<script>
var initialAction = (gasAction === 'status') ? 'status' : (gasAction === 'view' ? 'view' : 'entry');
var directMode = !!gasId;
var directTourId = gasId || null;
var currentTour = null;
var lastSubmitted = null;
var viewData = null;
var viewActiveDiv = 0;
var viewActiveLeague = {};
var viewMode = 'league';
var ALPHA = 'ABCDEFGHIJKLMNOPQRST';
var CATS = ['md','wd','xd'];
var CAT_LABELS = {md:'MD',wd:'WD',xd:'XD'};
var TEAM_COLORS = [
  {bg:'rgba(124,77,255,0.2)',text:'#b39ddb'},
  {bg:'rgba(0,161,255,0.15)',text:'#4fc3f7'},
  {bg:'rgba(0,229,160,0.15)',text:'#00e5a0'},
  {bg:'rgba(255,209,102,0.15)',text:'#ffd166'},
  {bg:'rgba(255,79,107,0.15)',text:'#ff4f6b'},
  {bg:'rgba(255,160,50,0.15)',text:'#ffb74d'},
  {bg:'rgba(200,80,200,0.15)',text:'#ce93d8'},
  {bg:'rgba(100,200,80,0.15)',text:'#a5d6a7'},
  {bg:'rgba(255,120,120,0.15)',text:'#ef9a9a'},
  {bg:'rgba(100,160,255,0.15)',text:'#90caf9'},
  {bg:'rgba(80,220,200,0.15)',text:'#80cbc4'},
  {bg:'rgba(255,200,80,0.15)',text:'#ffe082'}
];

function esc(s){return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showLoading(on){document.getElementById('loading-overlay').style.display = on ? 'flex' : 'none';}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0';},2500);}

var currentPage = 'home';

function showPage(p) {
  currentPage = p;
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
  document.getElementById('page-'+p).classList.add('active');
  var inDirectStartPage = directMode && (p === 'entry' || p === 'status-form' || p === 'view');
  var showBack = (p !== 'home') && !inDirectStartPage;
  document.getElementById('back-btn').style.display = showBack ? 'block' : 'none';
  var topBtn = document.getElementById('top-btn');
  if (topBtn) {
    if (gasUrl) topBtn.href = gasUrl + '?mode=public';
    topBtn.style.display = (p === 'home') ? 'none' : 'block';
  }
  window.scrollTo(0,0);
}


function goHome() {
  if (directMode) {
    if (initialAction === 'status') openStatusFor(directTourId);
    else if (initialAction === 'view') openViewFor(directTourId);
    else openEntryFor(directTourId);
    return;
  }
  if (currentPage === 'tour-menu') {
    currentTour = null;
    menuTour = null;
    showPage('home');
    loadTourList();
    return;
  }
  if (menuTour) {
    showPage('tour-menu');
    return;
  }
  currentTour = null;
  showPage('home');
  loadTourList();
}

function onThanksBack() {
  if (directMode) { goHome(); return; }
  if (menuTour) { showPage('tour-menu'); return; }
  goHome();
}

function loadTourList() {
  showLoading(true);
  if (typeof google === 'undefined' || !google.script) {
    showLoading(false);
    document.getElementById('tour-list').innerHTML = '<div class="alert alert-warn">この画面はGoogle Apps Script上でのみ動作します。</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function(list){ showLoading(false); renderTourList(list); })
    .withFailureHandler(function(e){ showLoading(false); document.getElementById('tour-list').innerHTML = '<div class="alert alert-warn">読み込みエラー: '+esc(e.message)+'</div>'; })
    .loadTournamentList();
}

function renderTourList(list) {
  var el = document.getElementById('tour-list');
  if (!list || list.length === 0) {
    el.innerHTML = '<div class="alert alert-info">現在エントリー受付中の大会はありません。</div>';
    return;
  }
  el.innerHTML = list.map(function(t) {
    return '<div class="tour-card" onclick="openTourMenu(\''+esc(t.id)+'\')">' +
      '<div style="flex:1;min-width:0">' +
      '<div class="tour-card-name">'+esc(t.name || '名前なし')+'</div>' +
      '<div class="tour-card-sum">'+esc(t.summary || '')+'</div>' +
      '</div>' +
      '<span style="color:var(--text3);font-size:24px;flex-shrink:0;font-weight:900">›</span></div>';
  }).join('');
}

var menuTour = null;

function openTourMenu(id) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(info) {
      showLoading(false);
      if (!info) { alert('大会情報を取得できませんでした'); return; }
      menuTour = info;
      currentTour = info;
      renderTourMenu();
      showPage('tour-menu');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('読み込みエラー: '+e.message); })
    .getPublicTournamentInfo(id);
}

function renderTourMenu() {
  if (!menuTour) return;
  document.getElementById('menu-tour-name').textContent = menuTour.name;
  var grid = document.getElementById('menu-current-matches');
  var divs = (menuTour.divisions || []);
  if (!divs.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#1a1a2e;font-weight:700">部門が未設定です</div>';
    return;
  }
  grid.innerHTML = divs.map(function(d) {
    var num = (menuTour.currentMatch && menuTour.currentMatch[d.name]) || '—';
    return '<div class="match-num-item"><div class="match-num-label">'+esc(d.name)+'</div><div class="match-num-val">'+esc(num)+'</div></div>';
  }).join('');
}

function goToMode(mode) {
  if (!menuTour) return;
  var id = menuTour.id;
  if (mode === 'entries') openViewFor(id, 'entries');
  else if (mode === 'league') openViewFor(id, 'league');
  else if (mode === 'tournament') openViewFor(id, 'tournament');
  else if (mode === 'info') showInfoPage();
  else if (mode === 'entry') openEntryFor(id);
  else if (mode === 'status') openStatusFor(id);
}

function showInfoPage() {
  if (!menuTour) return;
  var html = '';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:800;letter-spacing:.1em;margin-bottom:6px">TOURNAMENT</div>';
  html += '<div style="font-size:18px;font-weight:900;margin-bottom:14px">'+esc(menuTour.name)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:800;letter-spacing:.1em;margin-bottom:6px">DIVISIONS</div>';
  html += '<div style="margin-bottom:14px">'+(menuTour.divisions||[]).map(function(d){return '<span style="display:inline-block;background:var(--accent-dim);color:var(--accent);padding:4px 12px;border-radius:14px;font-weight:800;margin:0 6px 6px 0">'+esc(d.name)+'</span>';}).join('')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:800;letter-spacing:.1em;margin-bottom:6px">TEAM SIZE</div>';
  html += '<div style="font-size:15px;font-weight:700;margin-bottom:14px">1チーム '+esc(menuTour.membersPerTeam)+' 名</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:800;letter-spacing:.1em;margin-bottom:6px">ENTRIES</div>';
  html += '<div style="font-size:15px;font-weight:700">'+esc(menuTour.entryCount)+' チーム エントリー済み</div>';
  document.getElementById('tour-info-body').innerHTML = html;
  showPage('tour-info');
}

var selectedDivision = '';

function openEntryFor(id) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(info) {
      showLoading(false);
      if (!info) { alert('大会情報を取得できませんでした'); return; }
      currentTour = info;
      document.getElementById('tour-name').textContent = info.name;
      document.getElementById('tour-sub').textContent = '1チーム ' + info.membersPerTeam + ' 名で登録 ／ 現在 ' + info.entryCount + ' チーム エントリー済み';
      document.getElementById('e-team-name').value = '';
      ['e-email','e-rep-name','e-address','e-phone'].forEach(function(idStr){var n=document.getElementById(idStr); if(n) n.value='';});
      selectedDivision = '';
      renderDivisionPicker();
      renderMembers();
      showPage('entry');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('読み込みエラー: '+e.message); })
    .getPublicTournamentInfo(id);
}

function renderDivisionPicker() {
  var wrap = document.getElementById('e-division-wrap');
  var el = document.getElementById('e-divisions');
  var divs = (currentTour && currentTour.divisions) || [];
  if (!divs.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  el.innerHTML = divs.map(function(d) {
    var isSel = d.name === selectedDivision;
    return '<button type="button" class="div-pick-btn'+(isSel?' active':'')+'" onclick="pickDivision(\''+esc(d.name)+'\')">'+esc(d.name)+'</button>';
  }).join('');
}

function pickDivision(name) {
  selectedDivision = name;
  renderDivisionPicker();
}

function openStatusFor(id) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(info) {
      showLoading(false);
      if (!info) { alert('大会情報を取得できませんでした'); return; }
      currentTour = info;
      document.getElementById('status-tour-name').textContent = info.name;
      document.getElementById('s-email').value = '';
      showPage('status-form');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('読み込みエラー: '+e.message); })
    .getPublicTournamentInfo(id);
}

function renderMembers() {
  var n = currentTour.membersPerTeam;
  document.getElementById('e-member-count').textContent = '（'+n+'名分）';
  var html = '';
  for (var i = 0; i < n; i++) {
    html += '<div class="member-row">' +
      '<span class="member-lbl">'+(i+1)+'</span>' +
      '<input class="member-name-inp" type="text" id="m-name-'+i+'" placeholder="名前" maxlength="40">' +
      '<select class="member-gender-inp" id="m-gender-'+i+'"><option value="">性別</option><option value="男">男</option><option value="女">女</option></select>' +
      '<input class="member-age-inp" type="number" id="m-age-'+i+'" min="0" max="120" inputmode="numeric" placeholder="年齢">' +
      '</div>';
  }
  document.getElementById('e-members').innerHTML = html;
}

function onSubmit() {
  if (!currentTour) return;
  var teamName = document.getElementById('e-team-name').value.trim();
  if (!teamName) { showToast('チーム名を入力してください'); return; }
  var repName = document.getElementById('e-rep-name').value.trim();
  if (!repName) { showToast('代表者氏名を入力してください'); return; }
  var address = document.getElementById('e-address').value.trim();
  if (!address) { showToast('住所を入力してください'); return; }
  var phone = document.getElementById('e-phone').value.trim();
  if (!phone) { showToast('電話番号を入力してください'); return; }
  if (!/^[\d\-+()\s]+$/.test(phone)) { showToast('電話番号の形式が正しくありません'); return; }
  var email = document.getElementById('e-email').value.trim();
  if (!email) { showToast('メールアドレスを入力してください'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('メールアドレスの形式が正しくありません'); return; }
  var divs = (currentTour && currentTour.divisions) || [];
  if (divs.length > 0 && !selectedDivision) { showToast('希望部門を選択してください'); return; }
  var members = [];
  var n = currentTour.membersPerTeam;
  var filledCount = 0;
  for (var i = 0; i < n; i++) {
    var name = document.getElementById('m-name-'+i).value.trim();
    var ageStr = document.getElementById('m-age-'+i).value.trim();
    var age = ageStr === '' ? '' : parseInt(ageStr);
    var gender = document.getElementById('m-gender-'+i).value;
    members.push({name:name, age:age, gender:gender});
    if (name) filledCount++;
  }
  if (filledCount === 0) { showToast('メンバーを最低1名入力してください'); return; }

  var payload = {teamName: teamName, email: email, repName: repName, address: address, phone: phone, division: selectedDivision, members: members};
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      showLoading(false);
      if (!res || !res.ok) { alert((res && res.error) || '送信に失敗しました'); return; }
      lastSubmitted = {tournament: currentTour.name, team: teamName, email: email, repName: repName, address: address, phone: phone, division: selectedDivision, members: members};
      renderThanks();
      var btn = document.getElementById('thanks-back-btn');
      if (btn) {
        if (directMode) { btn.style.display = 'none'; }
        else { btn.style.display = ''; btn.textContent = menuTour ? '大会メニューへ戻る' : '大会一覧へ戻る'; }
      }
      showPage('thanks');
    })
    .withFailureHandler(function(e){ showLoading(false); alert('送信エラー: '+e.message); })
    .submitEntry(currentTour.id, JSON.stringify(payload));
}

function onCheckStatus() {
  if (!currentTour) return;
  var email = document.getElementById('s-email').value.trim();
  if (!email) { showToast('メールアドレスを入力してください'); return; }
  showLoading(true);

function renderStatusResult(res, email) {

    html = '<div class="alert alert-warn" style="margin-top:14px">「'+esc(email)+'」のエントリーは見つかりませんでした。<br>メールアドレスをご確認ください。</div>';

    '<div style="font-size:36px;line-height:1;margin-bottom:8px">'+icon+'</div>' +
    '<div style="display:inline-block;padding:6px 16px;background:'+bgColor+';color:'+color+';border:1px solid '+color+';border-radius:20px;font-weight:700;font-size:14px">'+label+'</div>' +

  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TEAM</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.teamName || '-')+'</div>';

    html += '<div style="font-weight:700;margin-bottom:10px">'+esc(res.division)+'</div>';
  }

    html += '<div style="font-weight:700;color:var(--accent)">'+esc(res.placedLabel)+'</div>';

function buildViewTournamentPanel(di) {
  var div = viewData.divisions[di] || {};
  var ts = (viewData.tournamentStates || [])[di];
  if (!ts || !ts.seeds || !ts.seeds.length) {
    return '<div class="alert alert-warn">この部門のトーナメントは未生成です</div>';
  }
  var seeds = ts.seeds;
  var matchResults = ts.matchResults || {};
  var rounds = vComputeRounds(seeds, matchResults);
  var totalRounds = rounds.length - 1;

  var html = '<div class="alert alert-info" style="margin-bottom:12px;font-size:12px">' +
    esc(div.name) + ' — シード ' + seeds.length + ' チーム</div>';

  html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">SEED</div>';
  html += '<div class="tourn-seed-list">';
  seeds.forEach(function(s, i) {
    if (!s) return;
    var sc = i===0?'var(--yellow)':i===1?'var(--text2)':i===2?'#cd7f32':'var(--text3)';
    var color = s.color || {bg:'var(--bg3)', text:'var(--text2)'};
    html += '<div class="tourn-seed-item">' +
      '<span class="seed-num" style="color:'+sc+'">'+(i+1)+'</span>' +
      '<span class="seed-league" style="background:'+color.bg+';color:'+color.text+'">'+esc(s.leagueLabel||'')+'リーグ '+((s.rankInLeague||0)+1)+'位</span>' +
      '<span class="seed-name">'+esc(s.name||'')+'</span>' +
      '<span class="seed-stat" style="margin-left:auto">'+(s.totalW||0)+'勝 '+((s.diff||0)>=0?'+':'')+(s.diff||0)+'</span>' +
      '</div>';
  });
  html += '</div>';

  if (totalRounds <= 0) return html;

  var roundNames = ['1回戦','2回戦','準々決勝','準決勝','決勝'];
  html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:16px 0 8px">BRACKET</div>';
  html += '<div class="bracket-rounds">';

  for (var ri = 0; ri < totalRounds; ri++) {
    var matchCount = rounds[ri].length / 2;
    var rName = roundNames[Math.max(0, roundNames.length-totalRounds+ri)] || ('第'+(ri+1)+'回戦');
    html += '<div class="bracket-round"><div class="bracket-round-title">'+rName+'</div><div class="bracket-col">';
    for (var mi = 0; mi < matchCount; mi++) {
      var teamA = rounds[ri][mi*2], teamB = rounds[ri][mi*2+1];
      var key = ri+'_'+mi;
      var res = matchResults[key];
      var autoWinner = (!teamB && teamA) ? teamA : (!teamA && teamB ? teamB : null);
      var winner = res ? res.winner : autoWinner;
      html += '<div class="bracket-spacer"></div><div class="bracket-match">';
      if (res) {
        var cr = CATS.map(function(c) {
          var w = vCatWin(res[c] || []);
          return '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:9px;color:'+(w==='A'?'var(--accent)':'var(--red)')+'">'+CAT_LABELS[c]+(w==='A'?'○':'✕')+'</span>';
        }).join(' ');
        html += '<div style="text-align:center;padding:2px 4px;display:flex;gap:4px;justify-content:center">'+cr+'</div>';
      }
      html += vTeamRow(teamA, winner === teamA, seeds);
      html += '<div class="bracket-divider"></div>';
      html += vTeamRow(teamB, winner === teamB, seeds);
      html += '</div><div class="bracket-gap"></div>';
    }
    html += '<div class="bracket-spacer"></div></div></div>';
  }

  var champion = rounds[totalRounds] ? rounds[totalRounds][0] : null;
  html += '<div class="bracket-round"><div class="bracket-round-title" style="color:var(--yellow)">🏆 優勝</div>' +
    '<div class="bracket-col" style="justify-content:center;align-items:center;padding:16px 8px">' +
    (champion
      ? '<div style="text-align:center"><div style="font-size:22px;margin-bottom:6px">🏆</div><div style="font-size:11px;font-weight:700;color:var(--yellow)">'+esc(champion.name)+'</div><div style="font-size:9px;color:var(--text3);margin-top:2px">'+esc(champion.leagueLabel||'')+'リーグ '+((champion.rankInLeague||0)+1)+'位</div></div>'
      : '<div style="text-align:center;color:var(--text3);font-size:11px">決勝<br>勝者</div>') +
    '</div></div>';
  html += '</div>';
  return html;
}

function vTeamRow(team, isWin, seeds) {
  if (!team) return '<div class="bracket-team bye"><span class="bracket-team-seed">—</span><span>BYE</span></div>';
  var si = seeds.indexOf(team);
  if (si < 0) {
    for (var i = 0; i < seeds.length; i++) {
      if (seeds[i] && seeds[i].name === team.name) { si = i; break; }
    }
  }
  var color = team.color || {bg:'var(--bg3)', text:'var(--text2)'};
  return '<div class="bracket-team'+(isWin?' winner':'')+'"><span class="bracket-team-seed" style="color:'+color.text+'">'+(si+1)+'</span><span style="font-size:9px;background:'+color.bg+';color:'+color.text+';padding:1px 4px;border-radius:3px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;flex-shrink:0">'+esc(team.leagueLabel||'')+((team.rankInLeague||0)+1)+'位</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">'+esc(team.name)+'</span>'+(isWin?'<span style="font-size:10px;color:var(--accent)">✓</span>':'')+'</div>';
}

function vComputeRounds(seeds, matchResults) {
  if (!seeds || !seeds.length) return [];
  var size = 1; while (size < seeds.length) size *= 2;
  var slots = new Array(size).fill(null);
  seeds.forEach(function(s, i) { slots[i] = s; });
  var rounds = [slots.slice()];
  var current = slots.slice();
  var ri = 0;
  while (current.length > 1) {
    var next = [];
    for (var mi = 0; mi < current.length; mi += 2) {
      var a = current[mi], b = current[mi+1];
      if (a && !b) { next.push(a); continue; }
      if (!a && b) { next.push(b); continue; }
      var res = matchResults[ri+'_'+(mi/2)];
      var winner = null;
      if (res) {
        if (res.winnerName) {
          for (var k = 0; k < seeds.length; k++) {
            if (seeds[k] && seeds[k].name === res.winnerName) { winner = seeds[k]; break; }
          }
        }
        if (!winner && res.winner) {
          if (typeof res.winner === 'object' && res.winner.name) {
            for (var k = 0; k < seeds.length; k++) {
              if (seeds[k] && seeds[k].name === res.winner.name) { winner = seeds[k]; break; }
            }
          }
        }
      }
      next.push(winner);
    }
    rounds.push(next);
    current = next;
    ri++;
  }
  return rounds;
}

function switchViewLeagueTab(di, li) {
  viewActiveLeague[di] = li;
  document.querySelectorAll('#view-div-pane-'+di+' .ltab').forEach(function(t,i){t.classList.toggle('active',i===li);});
  document.querySelectorAll('#view-div-pane-'+di+' .league-sub-panel').forEach(function(p,i){p.classList.toggle('active',i===li);});
}

function vMatchKey(a,b){return a<b?(a+'_'+b):(b+'_'+a);}
function vGetMatch(lg, ri, ci) {
  if (!lg.results) return null;
  var key = vMatchKey(ri, ci);
  if (!lg.results[key]) return null;
  var r = lg.results[key];
  if (ri < ci) return r;
  var flip = function(g) { return {a:g.b, b:g.a}; };
  return {md:r.md.map(flip), wd:r.wd.map(flip), xd:r.xd.map(flip)};
}
function vCWins(games){var wA=0,wB=0;games.forEach(function(g){if(g.a>g.b)wA++;else if(g.b>g.a)wB++;});return{wA:wA,wB:wB};}
function vCatWin(games){var w=vCWins(games);return w.wA>w.wB?'A':w.wB>w.wA?'B':null;}
function vTotalPts(match){var pf=0,pa=0;CATS.forEach(function(c){match[c].forEach(function(g){pf+=g.a;pa+=g.b;});});return{pf:pf,pa:pa};}

function buildViewLeaguePanel(di, li) {
  var lg = viewData.data[di][li];
  var teams = lg.teams || [];
  var nameHtml = '<div style="margin-bottom:14px">';
  teams.forEach(function(name, ti) {
    var c = TEAM_COLORS[ti % TEAM_COLORS.length];
    nameHtml += '<div class="team-list-row"><div class="team-list-badge" style="background:'+c.bg+';color:'+c.text+'">'+ALPHA[li]+(ti+1)+'</div><div class="team-list-name">'+esc(name)+'</div></div>';
  });
  nameHtml += '</div>';
  var tbl = '<div class="tbl-wrap"><table class="league-tbl"><thead><tr><th class="th-team"></th>';
  teams.forEach(function(_, ti) {
    var c = TEAM_COLORS[ti % TEAM_COLORS.length];
    tbl += '<th><span style="background:'+c.bg+';color:'+c.text+';padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700">'+ALPHA[li]+(ti+1)+'</span></th>';
  });
  tbl += '<th>MD</th><th>WD</th><th>XD</th><th>総勝</th></tr></thead><tbody>';
  teams.forEach(function(name, ri) {
    var c = TEAM_COLORS[ri % TEAM_COLORS.length];
    var mdW=0, wdW=0, xdW=0, totalW=0;
    tbl += '<tr><td class="team-cell"><span style="background:'+c.bg+';color:'+c.text+';padding:1px 6px;border-radius:4px;font-size:10px;margin-right:5px">'+ALPHA[li]+(ri+1)+'</span>'+esc(name)+'</td>';
    teams.forEach(function(_, ci) {
      if (ri===ci) { tbl += '<td class="diagonal"></td>'; return; }
      var r = vGetMatch(lg, ri, ci);
      if (!r) { tbl += '<td class="empty-cell" style="min-width:110px"><span style="color:var(--text3);font-size:11px">—</span></td>'; return; }
      var cellW=0; CATS.forEach(function(cat){if(vCatWin(r[cat])==='A')cellW++;});
      var cellL=3-cellW;
      var tcol = cellW>cellL?'var(--accent)':cellW<cellL?'var(--red)':'var(--yellow)';
      if (vCatWin(r.md)==='A') mdW++; if (vCatWin(r.wd)==='A') wdW++; if (vCatWin(r.xd)==='A') xdW++; totalW+=cellW;
      tbl += '<td class="score-cell"><div class="score-inner"><div class="total-row"><span class="total-lbl">TOT</span><span class="total-score" style="color:'+tcol+'">'+cellW+'</span><span style="font-size:10px;color:var(--text3)">-</span><span class="total-score" style="color:var(--text3)">'+cellL+'</span></div>';
      CATS.forEach(function(cat) {
        var games = r[cat]; var wins = vCWins(games); var iw = vCatWin(r[cat])==='A';
        tbl += '<div class="cat-row"><span class="cat-lbl '+cat+'">'+CAT_LABELS[cat]+'</span><span style="font-size:9px;font-weight:700;color:'+(iw?'var(--accent)':'var(--red)')+'">'+(iw?'○':'✕')+'</span><span class="game-scores">';
        games.forEach(function(g){ tbl += '<span class="gs '+(g.a>g.b?'w':'l')+'">'+g.a+'-'+g.b+'</span>'; });
        tbl += '</span><span class="cat-wl '+(wins.wA>wins.wB?'w':'l')+'">'+wins.wA+'-'+wins.wB+'</span></div>';
      });
      tbl += '</div></td>';
    });
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:var(--blue)">'+mdW+'</td>';
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:#f48fb1">'+wdW+'</td>';
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:13px;font-weight:700;color:#b39ddb">'+xdW+'</td>';
    tbl += '<td style="padding:5px;font-family:\'Barlow Condensed\',sans-serif;font-size:18px;font-weight:900;color:var(--accent)">'+totalW+'</td></tr>';
  });
  tbl += '</tbody></table></div>';
  return nameHtml + tbl;
}

function buildViewRankingPanel(di, li) {
  var lg = viewData.data[di][li];
  var teams = lg.teams || [];
  var div = viewData.divisions[di] || {};
  var adv = div.advanceCount || 0;
  var standings = teams.map(function(name, ti) {
    var totalW=0, mdW=0, wdW=0, xdW=0, pf=0, pa=0;
    teams.forEach(function(_, oi) {
      if (oi===ti) return;
      var r = vGetMatch(lg, ti, oi); if (!r) return;
      CATS.forEach(function(c){ if (vCatWin(r[c])==='A') totalW++; });
      if (vCatWin(r.md)==='A') mdW++; if (vCatWin(r.wd)==='A') wdW++; if (vCatWin(r.xd)==='A') xdW++;
      var pt = vTotalPts(r); pf += pt.pf; pa += pt.pa;
    });
    return {ti:ti, name:name, totalW:totalW, mdW:mdW, wdW:wdW, xdW:xdW, pf:pf, pa:pa, diff:pf-pa};
  });
  standings.sort(function(a,b){return b.totalW-a.totalW||b.diff-a.diff||b.pf-a.pf;});
  var html = '<div style="font-size:10px;color:var(--text3);padding:8px 0 6px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.08em">'+esc(div.name||'')+' '+ALPHA[li]+'リーグ 順位表</div>';

  standings.forEach(function(s, i) {
    var rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
    var advcls = i<adv?'advance-row':'';
    var diff = (s.diff>=0?'+':'') + s.diff;
    var c = TEAM_COLORS[s.ti % TEAM_COLORS.length];
    html += '<tr class="'+advcls+'"><td><span class="rank-num '+rc+'">'+(i+1)+'</span></td>' +
      '<td style="text-align:left;padding:8px"><div style="display:flex;align-items:center;gap:6px">' +
      '<span style="background:'+c.bg+';color:'+c.text+';padding:1px 7px;border-radius:4px;font-family:\'Barlow Condensed\',sans-serif;font-size:11px;font-weight:700">'+ALPHA[li]+(s.ti+1)+'</span>' +
      '<span style="font-weight:700;font-size:12px">'+esc(s.name)+'</span>' +
      (i<adv?'<span style="font-size:9px;background:var(--accent-dim);color:var(--accent);padding:1px 5px;border-radius:3px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700">進出</span>':'') +
      '</div></td>' +
      '<td><span style="font-family:\'Barlow Condensed\',sans-serif;font-size:16px;font-weight:700;color:var(--accent)">'+s.totalW+'</span></td>' +
      '<td style="color:var(--blue);font-family:\'Barlow Condensed\',sans-serif;font-weight:700">'+s.mdW+'</td>' +
      '<td style="color:#f48fb1;font-family:\'Barlow Condensed\',sans-serif;font-weight:700">'+s.wdW+'</td>' +
      '<td style="color:#b39ddb;font-family:\'Barlow Condensed\',sans-serif;font-weight:700">'+s.xdW+'</td>' +
      '<td style="color:var(--accent)">'+s.pf+'</td><td style="color:var(--red)">'+s.pa+'</td>' +
      '<td style="font-weight:700;color:'+(s.diff>=0?'var(--accent)':'var(--red)')+'">'+diff+'</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderThanks() {
  if (!lastSubmitted) return;
  var html = '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TOURNAMENT</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(lastSubmitted.tournament)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">TEAM</div>';
  html += '<div style="font-weight:700;margin-bottom:10px">'+esc(lastSubmitted.team)+'</div>';
  if (lastSubmitted.division) {
    html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">DIVISION</div>';
    html += '<div style="font-weight:700;margin-bottom:10px;color:var(--accent)">'+esc(lastSubmitted.division)+'</div>';
  }
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">REPRESENTATIVE</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.repName||'')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">ADDRESS</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.address||'')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">PHONE</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.phone||'')+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">EMAIL</div>';
  html += '<div style="margin-bottom:10px">'+esc(lastSubmitted.email)+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);font-family:\'Barlow Condensed\',sans-serif;font-weight:700;letter-spacing:.06em;margin-bottom:4px">MEMBERS</div>';
  html += '<div>' + lastSubmitted.members.filter(function(m){return m.name;}).map(function(m, i) {
    var meta = [];
    if (m.gender) meta.push(m.gender);
    if (m.age!==''&&m.age!=null) meta.push(m.age+'歳');
    return '<div style="padding:4px 0">'+(i+1)+'. '+esc(m.name)+(meta.length?' <span style="color:var(--text3)">('+esc(meta.join(' / '))+')</span>':'')+'</div>';
  }).join('') + '</div>';
  html += '<div style="margin-top:14px;padding:10px 14px;background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,209,102,0.3);border-radius:var(--radius);font-size:12px">⏳ 主催者の承認をお待ちください。承認後にこのメールアドレスで状況確認ができます。</div>';
  document.getElementById('thanks-summary').innerHTML = html;
}

if (directMode) {
  if (initialAction === 'status') openStatusFor(directTourId);
  else if (initialAction === 'view') openViewFor(directTourId);
  else openEntryFor(directTourId);
} else {
  loadTourList();
}
</script>
</body>
</html>
